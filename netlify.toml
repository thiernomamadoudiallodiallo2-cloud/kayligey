[build]
  publish = "public"
  functions = "netlify/functions"
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(self), microphone=(self)"
    # 'unsafe-inline' est nécessaire tant que l'interface reste un fichier unique avec scripts et gestionnaires intégrés.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://pay.wave.com https://*.twilio.com wss://*.twilio.com; media-src 'self' blob: mediastream:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
