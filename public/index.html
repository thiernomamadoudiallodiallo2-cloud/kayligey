<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Kayligey : trouver un médecin, prendre rendez-vous et suivre sa santé au Sénégal. Ne remplace pas les urgences : appelez le 1515.">
<meta name="theme-color" content="#0a2b2b">
<title>Kayligey — La santé, plus proche de vous</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --teal-950:#0a2b2b;--teal-800:#0f4d4d;--teal-700:#136363;--teal-500:#1a8080;--teal-100:#dbeeec;
  --gold-600:#c8930c;--gold-500:#e0a91a;--gold-100:#faf1dc;
  --clay-600:#c1440e;--clay-100:#fbe6db;
  --sand-50:#f7f5ef;--sand-100:#f1eee3;--ink-900:#182726;--ink-600:#4b5f5c;--line:#dcd6c6;--white:#ffffff;--ok:#2f7d4f;
  --radius:14px;--shadow:0 2px 10px rgba(15,77,77,.08), 0 1px 2px rgba(15,77,77,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--sand-50);color:var(--ink-900);-webkit-font-smoothing:antialiased;}
h1,h2,h3,.display{font-family:'Fraunces',serif;letter-spacing:-.01em;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--gold-100);}
.mono{font-family:'IBM Plex Mono',monospace;}
.mark{display:inline-flex;align-items:center;gap:10px;}
.mark svg{display:block;}
.mark-word{font-family:'Fraunces',serif;font-weight:600;font-size:22px;color:var(--teal-950);letter-spacing:-.01em;}
.mark-word em{font-style:italic;color:var(--gold-600);}
#app{min-height:100vh;}
.hidden{display:none !important;}
.login-wrap{min-height:100vh;display:flex;align-items:stretch;background:radial-gradient(1200px 600px at 85% -10%, rgba(224,169,26,.14), transparent 60%),var(--teal-950);}
.login-left{flex:1.1;padding:64px 56px;color:var(--sand-50);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;}
.login-left::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);background-size:18px 18px;opacity:.5;pointer-events:none;}
.login-tag{font-size:15px;color:var(--gold-500);font-weight:500;margin-bottom:18px;letter-spacing:.02em;}
.login-h1{font-size:48px;line-height:1.08;font-weight:600;max-width:520px;color:var(--sand-50);}
.login-h1 em{color:var(--gold-500);font-style:italic;}
.login-sub{margin-top:20px;font-size:16px;line-height:1.6;color:#c7d8d6;max-width:440px;}
.stat-row{display:flex;gap:36px;margin-top:48px;flex-wrap:wrap;}
.stat-row .stat b{display:block;font-family:'Fraunces',serif;font-size:30px;color:var(--gold-500);}
.stat-row .stat span{font-size:13px;color:#a9c0bd;}
.login-right{width:440px;background:var(--white);padding:52px 44px;display:flex;flex-direction:column;justify-content:center;}
.role-tabs{display:flex;background:var(--sand-100);border-radius:12px;padding:4px;margin:22px 0;}
.role-tab{flex:1;text-align:center;padding:9px 4px;border:none;background:transparent;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-600);}
.role-tab.active{background:var(--teal-950);color:var(--white);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-600);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em;}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:9px;font-size:14.5px;background:var(--sand-50);font-family:inherit;color:var(--ink-900);}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--teal-500);background:var(--white);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:10px;padding:12px 18px;font-weight:600;font-size:14.5px;transition:transform .1s ease;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--teal-950);color:var(--white);width:100%;}
.btn-primary:hover{background:var(--teal-800);}
.btn-gold{background:var(--gold-500);color:var(--teal-950);}
.btn-gold:hover{background:var(--gold-600);}
.btn-outline{background:transparent;border:1.5px solid var(--line);color:var(--ink-900);}
.btn-outline:hover{border-color:var(--teal-500);}
.btn-clay{background:var(--clay-600);color:var(--white);}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:8px;}
.btn-block{width:100%;}
.demo-row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;}
.demo-row .btn{flex:1;min-width:47%;font-size:12.5px;padding:9px 6px;}
.switch-link{text-align:center;font-size:13px;margin-top:16px;color:var(--ink-600);}
.switch-link b{color:var(--teal-700);cursor:pointer;}
.err{background:var(--clay-100);color:var(--clay-600);font-size:13px;padding:9px 12px;border-radius:8px;margin-bottom:12px;}
.shell{display:flex;min-height:100vh;}
.sidebar{width:250px;background:var(--teal-950);color:var(--sand-50);padding:22px 14px;display:flex;flex-direction:column;flex-shrink:0;}
.sidebar .mark-word{color:var(--sand-50);}
.side-role{font-size:11px;color:var(--gold-500);text-transform:uppercase;letter-spacing:.06em;margin:20px 4px 8px;font-weight:600;}
.side-user{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border-radius:10px;padding:10px;margin-top:16px;}
.side-user .av{width:36px;height:36px;border-radius:50%;background:var(--gold-500);color:var(--teal-950);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;}
.side-user .nm{font-size:13.5px;font-weight:600;}
.side-user .rl{font-size:11px;color:#a9c0bd;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;font-size:14px;font-weight:500;color:#cfe0de;background:transparent;border:none;text-align:left;width:100%;margin-bottom:2px;}
.nav-item:hover{background:rgba(255,255,255,.06);}
.nav-item.active{background:var(--gold-500);color:var(--teal-950);font-weight:700;}
.nav-item .ic{width:18px;text-align:center;}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);}
.main{flex:1;min-width:0;padding:30px 38px 60px;}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;flex-wrap:wrap;gap:12px;}
.topbar h1{font-size:26px;margin:0;color:var(--teal-950);}
.topbar .sub{color:var(--ink-600);font-size:13.5px;margin-top:3px;}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--teal-100);color:var(--teal-800);font-size:12px;font-weight:600;padding:5px 11px;border-radius:99px;}
.pill.gold{background:var(--gold-100);color:var(--gold-600);}
.pill.clay{background:var(--clay-100);color:var(--clay-600);}
.pill.ok{background:#e5f3ea;color:var(--ok);}
.grid{display:grid;gap:18px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g-side{grid-template-columns:2fr 1.1fr;}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr);}.g3{grid-template-columns:repeat(2,1fr);}.g-side{grid-template-columns:1fr;}}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
.card h3{margin:0 0 14px;font-size:16px;color:var(--teal-950);}
.kpi b{display:block;font-family:'Fraunces',serif;font-size:30px;color:var(--teal-950);}
.kpi span{font-size:12.5px;color:var(--ink-600);}
.kpi .trend{font-size:11.5px;color:var(--ok);font-weight:600;}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:30px 0 14px;}
.sec-title h2{font-size:18px;margin:0;color:var(--teal-950);}
.sec-title .lnk{font-size:13px;color:var(--teal-700);font-weight:600;}
.row-list{display:flex;flex-direction:column;gap:10px;}
.rowc{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--white);}
.rowc .av{width:40px;height:40px;border-radius:50%;background:var(--teal-100);color:var(--teal-800);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;}
.rowc .info{flex:1;min-width:0;}
.rowc .info .t1{font-weight:600;font-size:14px;}
.rowc .info .t2{font-size:12.5px;color:var(--ink-600);}
.rowc .actions{display:flex;gap:6px;flex-shrink:0;}
.doc-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;}
.doc-head{display:flex;gap:12px;align-items:flex-start;}
.doc-av{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--teal-700),var(--teal-950));color:var(--gold-500);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex-shrink:0;}
.doc-name{font-weight:700;font-size:15.5px;color:var(--teal-950);}
.doc-spec{font-size:12.5px;color:var(--ink-600);}
.doc-meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--ink-600);}
.stars{color:var(--gold-600);font-weight:600;font-size:13px;}
.doc-tarif{font-family:'Fraunces',serif;font-weight:600;color:var(--teal-950);font-size:16px;}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.filters select,.filters input{padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;font-size:13.5px;background:var(--white);}
.tag{display:inline-block;background:var(--sand-100);border-radius:7px;padding:3px 8px;font-size:11.5px;color:var(--ink-600);margin:2px 4px 2px 0;}
.badge-verif{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ok);font-weight:700;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-600);padding:8px 10px;border-bottom:2px solid var(--line);}
td{padding:11px 10px;border-bottom:1px solid var(--line);}
tr:last-child td{border-bottom:none;}
.overlay{position:fixed;inset:0;background:rgba(10,30,30,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
.modal{background:var(--white);border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:26px;}
.modal h2{margin:0 0 16px;font-size:20px;color:var(--teal-950);}
.modal-close{float:right;background:var(--sand-100);border:none;width:30px;height:30px;border-radius:50%;font-size:16px;}
#toastbox{position:fixed;bottom:22px;right:22px;z-index:400;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--teal-950);color:var(--white);padding:12px 16px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow);animation:slidein .25s ease;max-width:320px;}
.toast.clay{background:var(--clay-600);}
@keyframes slidein{from{transform:translateY(10px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.sos-btn{position:relative;background:var(--clay-600);color:var(--white);border:none;border-radius:18px;padding:26px;width:100%;text-align:left;overflow:hidden;}
.sos-btn::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 90% 10%, rgba(255,255,255,.18), transparent 60%);}
.sos-btn .big{font-family:'Fraunces',serif;font-size:24px;font-weight:600;}
.sos-btn .small{font-size:12.5px;opacity:.9;margin-top:4px;}
.chatwin{display:flex;flex-direction:column;height:440px;}
.chat-msgs{flex:1;overflow-y:auto;padding:6px 2px;display:flex;flex-direction:column;gap:8px;}
.bubble{max-width:75%;padding:9px 13px;border-radius:14px;font-size:13.5px;line-height:1.4;}
.bubble.me{align-self:flex-end;background:var(--teal-950);color:var(--white);border-bottom-right-radius:4px;}
.bubble.them{align-self:flex-start;background:var(--sand-100);color:var(--ink-900);border-bottom-left-radius:4px;}
.chat-input{display:flex;gap:8px;margin-top:10px;}
.chat-input input{flex:1;}
.langtoggle{display:flex;gap:4px;background:rgba(255,255,255,.08);border-radius:8px;padding:3px;}
.langtoggle button{background:transparent;border:none;color:#c7d8d6;font-size:11.5px;font-weight:700;padding:5px 8px;border-radius:6px;}
.langtoggle button.active{background:var(--gold-500);color:var(--teal-950);}
.empty{text-align:center;padding:40px 20px;color:var(--ink-600);}
.empty .ic{font-size:34px;margin-bottom:8px;}
.progress-bar{height:8px;border-radius:99px;background:var(--sand-100);overflow:hidden;}
.progress-bar > div{height:100%;background:var(--teal-700);border-radius:99px;}
@media(max-width:820px){
  .login-wrap{flex-direction:column;}
  .login-left{padding:40px 26px;}
  .login-right{width:auto;padding:34px 26px;}
  .sidebar{position:fixed;left:-260px;top:0;bottom:0;z-index:150;transition:left .2s ease;}
  .sidebar.open{left:0;}
  .main{padding:20px 16px 60px;}
  .menu-btn{display:inline-flex;}
}
.menu-btn{display:none;background:var(--teal-950);color:var(--white);border:none;border-radius:9px;padding:9px 12px;font-size:14px;}
.maint-banner{background:var(--clay-600);color:var(--white);text-align:center;font-size:13px;font-weight:600;padding:9px 16px;}
.maint-banner a{color:var(--white);text-decoration:underline;}
.chat-fab{position:fixed;bottom:22px;right:22px;width:56px;height:56px;border-radius:50%;background:var(--teal-950);color:var(--gold-500);border:none;font-size:24px;box-shadow:var(--shadow);z-index:300;display:flex;align-items:center;justify-content:center;}
.chat-fab:hover{background:var(--teal-800);}
.chatbot-win{position:fixed;bottom:90px;right:22px;width:320px;max-width:88vw;background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);z-index:300;overflow:hidden;display:flex;flex-direction:column;}
.chatbot-head{background:var(--teal-950);color:var(--white);padding:12px 14px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center;}
.chatbot-body{padding:12px 14px;max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;}
.chatbot-body .bubble{max-width:88%;}
.chatbot-suggest{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px;}
.chatbot-suggest button{background:var(--sand-100);border:none;border-radius:99px;padding:6px 11px;font-size:12px;color:var(--teal-800);}
.gps-chip{display:flex;align-items:center;gap:10px;background:var(--teal-100);border-radius:11px;padding:12px 14px;}
.gps-chip .txt{flex:1;font-size:13px;color:var(--teal-800);}
.gps-chip b{display:block;font-size:14.5px;}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;}
.dot.on{background:var(--ok);}
.dot.off{background:#b6b0a0;}
.avail-toggle{display:flex;align-items:center;justify-content:space-between;background:var(--sand-100);border-radius:11px;padding:12px 14px;}
.avail-toggle .sw{width:44px;height:24px;border-radius:99px;background:var(--line);position:relative;border:none;flex-shrink:0;}
.avail-toggle .sw.on{background:var(--ok);}
.avail-toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--white);transition:left .15s ease;}
.avail-toggle .sw.on::after{left:22px;}
.star-picker{display:flex;gap:6px;font-size:30px;color:var(--line);cursor:pointer;margin:14px 0;}
.star-picker span.active{color:var(--gold-500);}
.idcard{background:linear-gradient(135deg,var(--teal-950),var(--teal-700));color:var(--white);border-radius:18px;padding:22px;position:relative;overflow:hidden;}
.idcard::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 90% 0%, rgba(224,169,26,.25), transparent 60%);}
.idcard .top{display:flex;justify-content:space-between;align-items:center;position:relative;}
.idcard .av{width:54px;height:54px;border-radius:14px;background:var(--gold-500);color:var(--teal-950);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;margin-top:14px;}
.idcard .nom{font-family:'Fraunces',serif;font-size:19px;font-weight:600;margin-top:12px;}
.idcard .meta{font-size:12px;color:#bfd8d5;margin-top:2px;}
.idcard .grid-id{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;font-size:12px;position:relative;}
.idcard .grid-id b{display:block;font-size:13.5px;font-weight:700;}
.idcard .foot{margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,.18);display:flex;justify-content:space-between;font-size:11px;color:#bfd8d5;position:relative;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-day{aspect-ratio:1;border-radius:9px;border:1px solid var(--line);background:var(--white);padding:6px;font-size:12px;cursor:pointer;position:relative;}
.cal-day.today{border-color:var(--teal-500);border-width:2px;}
.cal-day.has-evt::after{content:"";position:absolute;bottom:6px;left:6px;width:6px;height:6px;border-radius:50%;background:var(--gold-500);}
.cal-day.pad{background:transparent;border:none;}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;font-size:11px;color:var(--ink-600);text-align:center;font-weight:600;}
.ref-code{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:700;letter-spacing:.05em;background:var(--gold-100);color:var(--gold-600);padding:12px 16px;border-radius:11px;display:inline-block;}
.share-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.share-row .btn{flex:1;min-width:110px;}
.pay-method{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;}
.pay-method .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;}
.pay-method.wave .ic{background:#e8f6f2;}
.pay-method.om .ic{background:#fff0e0;}
.pay-method:hover{border-color:var(--teal-500);cursor:pointer;}
.svc-tabs{display:flex;gap:8px;background:var(--sand-100);border-radius:12px;padding:5px;margin-bottom:20px;flex-wrap:wrap;}
.svc-tab{flex:1;min-width:140px;text-align:center;padding:10px 8px;border:none;background:transparent;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink-600);}
.svc-tab.active{background:var(--teal-950);color:var(--white);}
.steps-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
@media(max-width:900px){.steps-row{grid-template-columns:repeat(2,1fr);}}
.step-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:center;}
.step-card .num{width:30px;height:30px;border-radius:50%;background:var(--gold-500);color:var(--teal-950);display:flex;align-items:center;justify-content:center;font-weight:700;margin:0 auto 10px;font-size:14px;}
.step-card .t{font-weight:700;font-size:13.5px;margin-bottom:3px;}
.step-card .d{font-size:11.5px;color:var(--ink-600);}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;}
@media(max-width:1100px){.cat-grid{grid-template-columns:repeat(2,1fr);}}
.cat-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:center;box-shadow:var(--shadow);}
.cat-card:hover{border-color:var(--teal-500);cursor:pointer;}
.cat-card .ic{font-size:26px;margin-bottom:8px;}
.cat-card .t{font-weight:700;font-size:13px;color:var(--teal-950);}
.cat-card .c{font-size:11.5px;color:var(--ink-600);margin-top:2px;}
.fav-btn{background:var(--white);border:1.5px solid var(--line);border-radius:9px;width:34px;height:34px;flex-shrink:0;font-size:15px;}
.fav-btn.active{background:var(--clay-100);border-color:var(--clay-600);color:var(--clay-600);}
.mission-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px;}
.mission-card:hover{border-color:var(--teal-500);cursor:pointer;}
.mission-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}

<body>
<div id="app"></div>
<div id="toastbox"></div>

<script>
/* KAYLIGEY — plateforme de télémédecine (single-file) — stockage localStorage */
const LS_KEY = 'kayligey_db_v2';
const SESSION_KEY = 'kayligey_session_v1';

const ICONS = {
  home:'⌂', doctor:'🩺', calendar:'📅', file:'📁', vitals:'📈', pharmacy:'💊',
  sos:'🆘', family:'👨‍👩‍👧', chat:'💬', profile:'⚙️', logout:'⎋', bell:'🔔',
  stats:'📊', check:'✔', clock:'⏱', hospital:'🏥', shield:'🛡', users:'👥',
  patients:'🧍', rx:'📝', money:'₣', star:'★', gift:'🎁', litige:'⚖️', gps:'🗺️',
  settings:'⚙️', whatsapp:'💬', card:'🪪', tool:'🧰'
};

function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9); }
function fdate(d){ const dt=new Date(d); return dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}); }
function fmoney(n){ return n.toLocaleString('fr-FR')+' FCFA'; }
function todayISO(offsetDays=0){ const d=new Date(); d.setDate(d.getDate()+offsetDays); return d.toISOString().slice(0,10); }

const FIRST_NAMES = ['Awa','Moussa','Fatou','Ibrahima','Aminata','Cheikh','Khady','Ousmane','Bineta','Mamadou','Ndeye','Modou','Aissatou','Serigne','Coumba','Abdoulaye','Rokhaya','Pape','Sokhna','Lamine'];
const LAST_NAMES = ['Diop','Ndiaye','Fall','Sarr','Ba','Gueye','Sow','Diallo','Cissé','Faye','Kane','Thiam','Diagne','Mbaye','Sy','Camara'];
const VILLES = ['Thiès','Dakar','Mbour','Saint-Louis','Kaolack','Ziguinchor','Touba','Diourbel','Louga','Tambacounda'];
const SPECIALITES = ['Médecine générale','Gynécologie','Pédiatrie','Cardiologie','Dermatologie','Diabétologie','Psychiatrie','Ophtalmologie','ORL','Médecine interne'];
const LANGUES = ['Français','Wolof','Anglais','Pulaar'];

const CATEGORIES_SERVICES = [
  {cle:'Infirmier(ère) à domicile', ic:'💉'},
  {cle:'Aide-soignant(e)', ic:'🧑‍⚕️'},
  {cle:'Sage-femme à domicile', ic:'🤰'},
  {cle:'Kinésithérapeute', ic:'🦵'},
  {cle:'Garde-malade / veille', ic:'🌙'},
  {cle:'Auxiliaire de puériculture', ic:'🍼'},
  {cle:'Coach bien-être et nutrition', ic:'🥗'},
  {cle:'Livraison de médicaments', ic:'🛵'}
];

function rnd(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function rndInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function fullName(){ return rnd(FIRST_NAMES)+' '+rnd(LAST_NAMES); }

let DB = null;
let SESSION = null;
let VIEW = 'login';
let SUBVIEW = null;
let LANG = 'fr';
let CHAT_OPEN = false;
let CHAT_LOG = [{from:'bot', text:"Bonjour ! Je suis l'assistant Kayligey 👋 Comment puis-je vous aider ?"}];

function loadDB(){
  const raw = localStorage.getItem(LS_KEY);
  if(raw){ try{ DB = JSON.parse(raw); ensureDB(); return; }catch(e){} }
  DB = emptyDB();
  saveDB();
}
function saveDB(){ try{ computeStats(); deepClean(DB); }catch(e){} localStorage.setItem(LS_KEY, JSON.stringify(DB)); }
function loadSession(){
  const raw = localStorage.getItem(SESSION_KEY);
  if(raw){ try{ SESSION = JSON.parse(raw); }catch(e){ SESSION=null; } }
}
function saveSession(){ SESSION.t=Date.now(); localStorage.setItem(SESSION_KEY, JSON.stringify(SESSION)); }

function currentUser(){ return DB.users.find(u=>u.id===SESSION.userId); }
function currentPatient(){ return DB.patients.find(p=>p.userId===SESSION.userId); }
function currentDoctor(){ return DB.doctors.find(d=>d.userId===SESSION.userId); }
function currentProvider(){ return DB.providers.find(pr=>pr.userId===SESSION.userId); }

function toast(msg, type){
  const box = document.getElementById('toastbox');
  const t = document.createElement('div');
  t.className = 'toast'+(type==='err'?' clay':'');
  t.textContent = msg;
  box.appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}

function navigate(view, sub){ VIEW = view; SUBVIEW = sub||null; render(); window.scrollTo(0,0); }

function render(){
  const app = document.getElementById('app');
  if(!SESSION){ app.innerHTML = renderLogin(); attachLoginEvents(); return; }
  const role = SESSION.role;
  const maintBanner = (DB.settings.maintenance && role!=='admin') ? `<div class="maint-banner">🔧 Maintenance en cours — certaines fonctionnalités peuvent être limitées. Urgence : appelez le <b>1515</b> (SAMU)</div>` : '';
  app.innerHTML = `
    ${maintBanner}
    <div class="shell">
      ${renderSidebar(role)}
      <div class="main">
        ${renderTopbar(role)}
        ${role==='patient' ? renderPatientView() : role==='medecin' ? renderDoctorView() : role==='prestataire' ? renderProviderView() : role==='pharmacien' ? renderPharmView() : renderAdminView()}
      </div>
    </div>
    <button class="chat-fab" id="chatFab" title="Assistant Kayligey">🤖</button>
    ${CHAT_OPEN ? renderChatbotWindow() : ''}
  `;
  attachGlobalEvents();
  attachChatbotEvents();
}

function markSvg(color1,color2){
  color1=color1||'var(--gold-500)'; color2=color2||'var(--teal-500)';
  return `<svg width="30" height="30" viewBox="0 0 40 40" fill="none">
    <path d="M2 21H10L14 10L20 32L24 18L27 21H38" stroke="${color1}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M20 6C20 6 27 12 27 18.5C27 22.6 23.9 26 20 26C16.1 26 13 22.6 13 18.5C13 12 20 6 20 6Z" stroke="${color2}" stroke-width="2" stroke-linejoin="round" opacity="0.55"/>
  </svg>`;
}
function logoBlock(){ return `<div class="mark">${markSvg()}<span class="mark-word">Kay<em>ligey</em></span></div>`; }

function renderSidebar(role){
  const user = currentUser();
  const initials = user.nom.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();
  const items = navList(role);
  return `
  <div class="sidebar" id="sidebar">
    ${logoBlock()}
    <div class="side-role">${role==='patient'?'Espace Patient':role==='medecin'?'Espace Médecin':role==='prestataire'?'Espace Prestataire':role==='pharmacien'?'Espace Pharmacien':'Espace Administrateur'}</div>
    <div style="margin-top:4px;display:flex;flex-direction:column;">
      ${items.map(([v,ic,label])=>`<button class="nav-item ${VIEW===v?'active':''}" data-nav="${v}"><span class="ic">${ICONS[ic]}</span>${label}</button>`).join('')}
    </div>
    <div class="sidebar-foot">
      <div class="side-user">
        ${avHtml(user.id,initials,'av')}
        <div><div class="nm">${user.nom}</div><div class="rl">${user.tel||user.email}</div></div>
      </div>
      <button class="nav-item" data-a="mycard"><span class="ic">🪪</span>Ma carte</button>
      <button class="nav-item" id="logoutBtn" style="margin-top:10px;"><span class="ic">${ICONS.logout}</span>Déconnexion</button>
    </div>
  </div>`;
}
function viewTitle(view){
  const titles = {
    dashboard:'Bonjour, '+ (currentUser()? currentUser().nom.split(' ')[0]:'') , medecins:'Trouver un médecin', rdv:'Mes rendez-vous',
    dossier:'Dossier médical', constantes:'Suivi de mes constantes', pharmacie:'Pharmacie & médicaments',
    famille:'Profil famille', messages:'Messagerie sécurisée', sos:'Urgence', profil:'Mon profil',
    agenda:'Mon agenda', patients:'Mes patients', ordonnances:'Ordonnances', stats:'Statistiques',
    validation:'Validation des médecins', structures:'Structures de santé', rbac:'Rôles & permissions',
    calendrier:'Calendrier', parrainage:'Parrainage', litiges:'Litiges', carte:'Carte de couverture GPS', parametres:'Paramètres système',
    services:'Services à domicile', missions:'Missions disponibles', mesdevis:'Mes devis envoyés',
    interventions:'Mes interventions', avis:'Avis reçus', prestataires:'Validation des prestataires'
  };
  return titles[view]||'Kayligey';
}
function renderTopbar(role){
  const user = currentUser();
  const notifCount = (DB.notifications||[]).filter(n=>n.userId===user.id && !n.lu).length;
  return `
  <div class="topbar">
    <div>
      <button class="menu-btn" id="menuBtn">☰</button>
      <h1>${viewTitle(VIEW)}</h1>
      <div class="sub">${fdate(todayISO())} · ${role==='patient'?'Votre espace santé personnel':role==='medecin'?"Votre pratique en un coup d'œil":role==='prestataire'?'Vos missions et interventions':"Vue d'ensemble de la plateforme"}</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      
      <button class="btn btn-outline btn-sm" id="notifBtn">${ICONS.bell} ${notifCount>0?'<span class="pill clay" style="margin-left:4px;">'+notifCount+'</span>':''}</button>
    </div>
  </div>`;
}

function attachGlobalEvents(){
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>navigate(b.dataset.nav));
  const logout = document.getElementById('logoutBtn');
  if(logout) logout.onclick=()=>{KAYAPI.logout(); const uu=userOf(SESSION.userId); if(uu){ uu.token=''; saveDB(); } SESSION=null; localStorage.removeItem(SESSION_KEY); VIEW='login'; render(); };
  const menuBtn = document.getElementById('menuBtn');
  if(menuBtn) menuBtn.onclick=()=> document.getElementById('sidebar').classList.toggle('open');
  document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{ LANG=b.dataset.lang; toast(LANG==='wo'?'Wolof : interface partielle':'Français activé'); render(); });
  const notifBtn = document.getElementById('notifBtn');
  if(notifBtn) notifBtn.onclick=()=>openNotifModal();
  attachViewEvents();
}

function openNotifModal(){
  const user = currentUser();
  const list = (DB.notifications||[]).filter(n=>n.userId===user.id).sort((a,b)=>b.date.localeCompare(a.date));
  openModal('Notifications', `
    <div class="row-list">
    ${list.length? list.map(n=>`<div class="rowc"><div class="av">${ICONS.bell}</div><div class="info"><div class="t1">${n.text}</div><div class="t2">${fdate(n.date)}</div></div>${!n.lu?'<span class="pill gold">Nouveau</span>':''}</div>`).join(''):'<div class="empty"><div class="ic">🔔</div>Aucune notification pour le moment.</div>'}
    </div>
  `);
  list.forEach(n=>n.lu=true); saveDB();
}

function openModal(title, bodyHtml){
  document.querySelectorAll('#modalOverlay').forEach(x=>x.remove());
  const wrap = document.createElement('div');
  wrap.className='overlay'; wrap.id='modalOverlay';
  wrap.innerHTML = `<div class="modal"><button class="modal-close" id="modalClose">×</button><h2>${title}</h2>${bodyHtml}</div>`;
  document.body.appendChild(wrap);
  document.getElementById('modalClose').onclick=closeModal;
  wrap.addEventListener('click', e=>{ if(e.target.id==='modalOverlay') closeModal(); });
}
function closeModal(){ document.querySelectorAll('#modalOverlay').forEach(x=>x.remove()); }

let __ratingValue = 0;
function openRatingModal(doc, appt){
  __ratingValue = 0;
  openModal('Évaluer '+doc.nom, `
    <p style="font-size:13.5px;color:var(--ink-600);">Comment s'est passée votre consultation ?</p>
    <div class="star-picker" id="starPicker">${[1,2,3,4,5].map(i=>`<span data-star="${i}">★</span>`).join('')}</div>
    <textarea id="ratingComment" rows="3" placeholder="Commentaire (optionnel)"></textarea>
    <button class="btn btn-primary btn-block" id="sendRating" style="margin-top:12px;">Envoyer mon évaluation ⭐</button>
  `);
  document.querySelectorAll('[data-star]').forEach(s=>s.onclick=()=>{
    __ratingValue = +s.dataset.star;
    document.querySelectorAll('[data-star]').forEach(el=> el.classList.toggle('active', +el.dataset.star<=__ratingValue));
  });
  document.getElementById('sendRating').onclick=()=>{
    if(!__ratingValue){ toast('Sélectionnez une note.','err'); return; }
    const newNbAvis = doc.nbAvis+1;
    doc.note = (((parseFloat(doc.note)*doc.nbAvis)+__ratingValue)/newNbAvis).toFixed(1);
    doc.nbAvis = newNbAvis;
    appt.note = __ratingValue;
    saveDB(); closeModal(); toast('Merci pour votre évaluation !'); render();
  };
}

const CHAT_QUICK = ['Trouver un médecin','Services à domicile','Urgence','Paiement Wave/OM','Parler à un humain'];
function renderChatbotWindow(){
  return `
  <div class="chatbot-win" id="chatbotWin">
    <div class="chatbot-head"><span>🤖 Assistant Kayligey</span><button id="chatbotClose" style="background:transparent;border:none;color:var(--white);font-size:16px;">✕</button></div>
    <div class="chatbot-body" id="chatbotBody">
      ${CHAT_LOG.map(m=>`<div class="bubble ${m.from==='user'?'me':'them'}" style="align-self:${m.from==='user'?'flex-end':'flex-start'};">${m.text}</div>`).join('')}
    </div>
    <div class="chatbot-suggest">${CHAT_QUICK.map(q=>`<button data-quick="${q}">${q}</button>`).join('')}</div>
    <div class="chat-input" style="padding:0 14px 14px;">
      <input id="chatbotInput" placeholder="Écrivez votre question...">
      <button class="btn btn-primary btn-sm" id="chatbotSend">➤</button>
    </div>
  </div>`;
}
function chatbotReply(msg){
  const m = msg.toLowerCase();
  if(m.includes('urgence') || m.includes('sos')) return "En cas d'urgence vitale, utilisez le bouton SOS dans votre espace patient, ou contactez le SAMU au 15. Pour une urgence non-vitale, je peux vous rediriger vers un médecin disponible immédiatement.";
  if(m.includes('médecin') || m.includes('medecin') || m.includes('rdv') || m.includes('rendez')) return "Rendez-vous dans « Trouver un médecin » pour filtrer par spécialité, ville ou tarif, puis choisissez un créneau disponible pour prendre RDV.";
  if(m.includes('domicile') || m.includes('infirmier') || m.includes('aide-soignant') || m.includes('service') || m.includes('prestataire')) return "Direction « Services à domicile » : choisissez une catégorie (infirmier, aide-soignant, kiné, garde-malade...), réservez directement un pro vérifié, ou publiez votre besoin pour recevoir plusieurs devis à comparer.";
  if(m.includes('paiement') || m.includes('wave') || m.includes('orange')) return "Kayligey accepte Wave, Orange Money, Free Money et le paiement à la livraison pour la pharmacie. Le paiement des consultations se confirme directement après votre RDV.";
  if(m.includes('humain') || m.includes('assistance') || m.includes('conseiller')) return "Je transmets votre demande à notre support. Vous pouvez aussi nous écrire directement sur WhatsApp au 77 689 03 21.";
  if(m.includes('inscription') || m.includes('compte')) return "Pour créer un compte, cliquez sur « Créer un compte patient » depuis l'écran de connexion — c'est gratuit et ne prend qu'une minute.";
  return "Je peux vous aider à trouver un médecin, prendre un rendez-vous, comprendre le paiement, ou vous orienter en cas d'urgence. Que souhaitez-vous faire ?";
}
function attachChatbotEvents(){
  const fab = document.getElementById('chatFab');
  if(fab) fab.onclick=()=>{ CHAT_OPEN = !CHAT_OPEN; render(); };
  const closeBtn = document.getElementById('chatbotClose');
  if(closeBtn) closeBtn.onclick=()=>{ CHAT_OPEN=false; render(); };
  document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=> sendChatbotMsg(b.dataset.quick));
  const send = document.getElementById('chatbotSend');
  if(send) send.onclick=()=>{
    const inp = document.getElementById('chatbotInput'); const v = inp.value.trim(); if(!v) return; sendChatbotMsg(v);
  };
  const inp = document.getElementById('chatbotInput');
  if(inp) inp.onkeydown=(e)=>{ if(e.key==='Enter'){ const v=inp.value.trim(); if(v) sendChatbotMsg(v); } };
}
function sendChatbotMsg(text){
  CHAT_LOG.push({from:'user', text: String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')});
  CHAT_LOG.push({from:'bot', text: chatbotReply(text)});
  render();
  setTimeout(()=>{ const b=document.getElementById('chatbotBody'); if(b) b.scrollTop = b.scrollHeight; }, 30);
}

/* ===== PATIENT VIEW ===== */
function renderPatientView(){
  const p = currentPatient();
  switch(VIEW){
    case 'dashboard': return patientDashboard(p);
    case 'medecins': return patientDoctors(p);
    case 'services': return patientServices(p);
    case 'rdv': return patientAppointments(p);
    case 'dossier': return patientRecord(p);
    case 'constantes': return patientVitals(p);
    case 'pharmacie': return patientPharmacy(p);
    case 'famille': return patientFamily(p);
    case 'messages': return patientMessages(p);
    case 'sos': return patientSOS(p);
    case 'calendrier': return patientCalendarView(p);
    case 'parrainage': return patientReferral(p);
    case 'profil': return patientProfile(p);
    default: return patientDashboard(p);
  }
}

function patientDashboard(p){
  const myAppts = DB.appointments.filter(a=>a.patientId===p.id).sort((a,b)=>a.date.localeCompare(b.date));
  const upcoming = myAppts.filter(a=>a.date>=todayISO());
  const rec = DB.records[p.id];
  const lastVital = rec.vitals[rec.vitals.length-1];
  return `
  <div class="grid g4">
    <div class="card kpi"><b>${upcoming.length}</b><span>Rendez-vous à venir</span></div>
    <div class="card kpi"><b>${rec.consultations.length}</b><span>Consultations passées</span></div>
    <div class="card kpi"><b>${rec.ordonnances.length}</b><span>Ordonnances actives</span></div>
    <div class="card kpi"><b>${lastVital?lastVital.tension:'—'}</b><span>Dernière tension</span></div>
  </div>

  <div class="grid g-side" style="margin-top:20px;">
    <div>
      <div class="sec-title"><h2>Prochains rendez-vous</h2><span class="lnk" data-nav="rdv">Voir tout →</span></div>
      <div class="row-list">
        ${upcoming.length? upcoming.slice(0,3).map(a=>apptRow(a,'patient')).join('') : `<div class="card empty"><div class="ic">📅</div>Aucun rendez-vous prévu.<br><button class="btn btn-gold btn-sm" style="margin-top:10px;" data-nav="medecins">Prendre rendez-vous</button></div>`}
      </div>

      <div class="sec-title"><h2>Évolution de la tension</h2><span class="lnk" data-nav="constantes">Détails →</span></div>
      <div class="card">${vitalsChart(rec.vitals,'tension')}</div>
    </div>
    <div>
      <button class="sos-btn" data-nav="sos" style="margin-bottom:18px;">
        <div class="big">${ICONS.sos} Urgence SOS</div>
        <div class="small">Appeler le 1515, indiquer où vous êtes, prévenir un proche</div>
      </button>
      <div class="card" style="margin-bottom:18px;background:linear-gradient(135deg,var(--teal-800),var(--teal-950));color:var(--white);">
        <h3 style="color:var(--white);">${ICONS.tool} Besoin d'une aide à domicile ?</h3>
        <p style="font-size:12.5px;color:#c7d8d6;margin:0 0 12px;">Infirmier, aide-soignant, kiné, garde-malade... trouvez un pro vérifié ou publiez votre besoin et recevez des devis.</p>
        <button class="btn btn-gold btn-sm" data-nav="services">Explorer les services →</button>
      </div>
      ${remindersCard(p)}
      <div class="card">
        <h3>Carnet de vaccination</h3>
        <div class="row-list">
          ${(rec.vaccins||[]).map(v=>`<div class="rowc"><div class="av">💉</div><div class="info"><div class="t1">${v.nom}</div><div class="t2">${fdate(v.date)}</div></div><span class="pill ok">${ICONS.check} à jour</span></div>`).join('')}
        </div>
      </div>
    </div>
  </div>`;
}

function apptRow(a, side){
  const typeIcon = {video:'🎥',audio:'📞',chat:'💬',domicile:'🏠'}[a.type]||'📅';
  const statutPill = a.statut==='confirmé'?'pill ok':a.statut==='en attente'?'pill gold':a.statut==='annulé'?'pill clay':'pill';
  const withWho = side==='patient' ? a.doctorNom : a.patientNom;
  const doc = side==='patient' ? DB.doctors.find(d=>d.id===a.doctorId) : null;
  return `<div class="rowc">
    <div class="av">${typeIcon}</div>
    <div class="info"><div class="t1">${withWho}</div><div class="t2">${fdate(a.date)} à ${a.heure} · ${a.motif}${a.paiement?' · '+a.paiement.methode+(a.paiement.statut==='confirmé'?' ✔':' ⏳'):''}</div></div>
    <span class="${statutPill}">${a.statut}</span>${joinBtn(a)}
    ${side==='patient' && (a.statut==='confirmé'||a.statut==='en attente') ? `<div class="actions">
        ${doc?`<a class="btn btn-outline btn-sm" data-wa href="https://wa.me/221${doc.tel}" target="_blank" style="text-decoration:none;">${ICONS.whatsapp}</a>`:''}
        <button class="btn btn-outline btn-sm" data-appt-cancel="${a.id}">Annuler</button></div>`:''}
    ${side==='patient' && a.statut==='terminé' && !a.note ? `<div class="actions"><button class="btn btn-gold btn-sm" data-rate="${a.id}">★ Évaluer</button></div>`:''}
    ${side==='patient' && a.note ? `<span class="pill gold">★ ${a.note}/5</span>`:''}
    ${side==='medecin' ? `<div class="actions">
        ${a.statut==='en attente'?`<button class="btn btn-primary btn-sm" data-appt-confirm="${a.id}">Confirmer</button>`:''}
        ${a.statut!=='terminé'?`<button class="btn btn-outline btn-sm" data-appt-done="${a.id}">Terminer</button>`:''}
      </div>`:''}
  </div>`;
}

function vitalsChart(vitals, key){
  const cid = 'chart_'+key+'_'+Math.random().toString(36).slice(2,7);
  setTimeout(()=>drawChart(cid, vitals, key), 0);
  return `<canvas id="${cid}" width="600" height="180" style="width:100%;height:180px;"></canvas>`;
}
function drawChart(id, vitals, key){
  const canvas = document.getElementById(id);
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height, pad=30;
  ctx.clearRect(0,0,W,H);
  let values;
  if(key==='tension'){ values = vitals.map(v=>parseInt(v.tension.split('/')[0])); }
  else { values = vitals.map(v=>parseFloat(v[key])); }
  if(!values.length){ ctx.fillStyle='#999'; ctx.fillText('Pas encore de données', 20,90); return; }
  const min = Math.min(...values)-4, max = Math.max(...values)+4;
  const stepX = (W-2*pad)/Math.max(1,values.length-1);
  ctx.strokeStyle = '#e7e2d3'; ctx.lineWidth=1;
  for(let i=0;i<=3;i++){ const y = pad + i*(H-2*pad)/3; ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(W-pad,y); ctx.stroke(); }
  ctx.strokeStyle = '#136363'; ctx.lineWidth=2.4; ctx.beginPath();
  values.forEach((v,i)=>{
    const x = pad + i*stepX;
    const y = H-pad - ( (v-min)/(max-min) ) * (H-2*pad);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
  ctx.fillStyle = '#e0a91a';
  values.forEach((v,i)=>{
    const x = pad + i*stepX;
    const y = H-pad - ( (v-min)/(max-min) ) * (H-2*pad);
    ctx.beginPath(); ctx.arc(x,y,3.4,0,Math.PI*2); ctx.fill();
  });
}

let CAL_MONTH_OFFSET = 0;
function buildCalendar(events){
  const now = new Date();
  const view = new Date(now.getFullYear(), now.getMonth()+CAL_MONTH_OFFSET, 1);
  const year = view.getFullYear(), month = view.getMonth();
  const monthName = view.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  const firstDow = (new Date(year,month,1).getDay()+6)%7;
  const daysInMonth = new Date(year,month+1,0).getDate();
  const evtDates = new Set(events.map(e=>e.date));
  let cells = '';
  for(let i=0;i<firstDow;i++) cells += `<div class="cal-day pad"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = iso===todayISO();
    cells += `<div class="cal-day ${isToday?'today':''} ${evtDates.has(iso)?'has-evt':''}" data-cal-day="${iso}"><b>${d}</b></div>`;
  }
  return `
  <div class="sec-title" style="margin-top:0;"><h2 style="text-transform:capitalize;">${monthName}</h2>
    <div style="display:flex;gap:6px;"><button class="btn btn-outline btn-sm" id="calPrev">‹</button><button class="btn btn-outline btn-sm" id="calNext">›</button></div>
  </div>
  <div class="cal-head">${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(d=>`<div>${d}</div>`).join('')}</div>
  <div class="cal-grid">${cells}</div>
  <div class="card" id="calEventsPanel" style="margin-top:16px;">
    <div class="empty" style="padding:16px;"><div class="ic">📋</div>Cliquez sur un jour pour voir les rendez-vous.</div>
  </div>`;
}
function patientCalendarView(p){
  const events = DB.appointments.filter(a=>a.patientId===p.id);

}

function emptyDB(){return {users:[],doctors:[],patients:[],appointments:[],records:{},messages:[],pharmacyOrders:[],notifications:[],structures:[],litiges:[],providers:[],missions:[],serviceOrders:[],payments:[],tickets:[],alertes:[],
  catalogue:DEFAULT_MEDS.map(c=>({id:uid('md'),nom:c[0],prix:c[1]})),
  settings:{siteName:'Kayligey',slogan:'La santé, plus proche de vous',announcement:'',maintenance:false,maintenanceMsg:'La plateforme est en maintenance. Merci de revenir bientôt.',inscriptions:{patient:true,medecin:true,prestataire:true},commissionStandard:12,commissionPremium:8,emailAdmin:'',telAdmin:'',supportTel:'',supportEmail:'',telPaiement:'776890321',cardSeq:0,villes:VILLES.slice(),specialites:SPECIALITES.slice(),categories:CATEGORIES_SERVICES.map(c=>({...c}))}};}
function ensureDB(){const e=emptyDB();Object.keys(e).forEach(k=>{if(DB[k]===undefined)DB[k]=e[k];});DB.settings=Object.assign(e.settings,DB.settings);applyLists();}
function deepClean(o){for(const k in o){const v=o[k];if(typeof v==='string')o[k]=v.replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');else if(v&&typeof v==='object')deepClean(v);}}
function computeStats(){DB.doctors.forEach(d=>{const ap=DB.appointments.filter(a=>a.doctorId===d.id),done=ap.filter(a=>a.statut==='terminé');d.consultations=done.length;d.revenus=done.length*(+d.tarif||0);d.tauxAnnulation=ap.length?Math.round(ap.filter(a=>a.statut==='annulé').length/ap.length*100):0;});}

const KAYAPI={
  async post(p,b){return this.req('POST',p,b);},
  async req(m,p,b){
    try{
      const r=await fetch(p,{method:m,credentials:'same-origin',headers:{'content-type':'application/json','x-requested-with':'kayligey'},body:m==='GET'?undefined:JSON.stringify(b||{})});
      const d=await r.json().catch(()=>({}));
      return r.ok?{ok:true,status:r.status,...d}:{ok:false,status:r.status,error:d.error||'Erreur serveur ('+r.status+').'};
    }catch(e){return {ok:false,network:true,error:'Serveur d\u2019authentification injoignable. Vérifiez votre connexion et réessayez.'};}
  },
  me(){return this.req('GET','/api/auth/me');},
  // Rendez-vous (serveur) : prêt à être branché sur l'interface (étape 2b)
  doctors(qs){return this.req('GET','/api/doctors'+(qs?'?'+qs:''));},
  slots(doctorId){return this.req('GET','/api/doctors/'+doctorId+'/slots');},
  book(slotId,mode,motif,dependentId){return this.post('/api/appointments',{slotId,mode,motif,consent:true,dependentId});},
  myAppointments(){return this.req('GET','/api/appointments');},
  cancelAppointment(id,reason){return this.post('/api/appointments/'+id+'/cancel',{reason});},
  paymentsConfig(){return this.req('GET','/api/payments/config');},
  pay(appointmentId){return this.post('/api/payments/checkout',{appointmentId});}, // renvoie launch_url : ouvrir dans le navigateur (pas de webview)
  myPayments(){return this.req('GET','/api/payments');},
  receipt(paymentId){return this.req('GET','/api/payments/'+paymentId+'/receipt');},
  reschedule(id,slotId){return this.post('/api/appointments/'+id+'/reschedule',{slotId});},
  logout(){this.req('POST','/api/auth/logout',{});},
  // Profil local lié au compte serveur (données encore stockées dans ce navigateur, sans mot de passe)
  mirror(su){
    let u=DB.users.find(x=>x.sid===su.id)||DB.users.find(x=>x.tel===su.tel);
    if(u){u.sid=su.id;u.pwd='';u.role=su.role;if(su.nom&&!u.nom)u.nom=su.nom;saveDB();return u;}
    u={id:uid('u'),sid:su.id,role:su.role,nom:su.nom,tel:su.tel,email:su.email||'',pwd:'',actif:true,created:todayISO(),photo:'',statut:'approuvé',carte:nextCard(su.role),carteDate:todayISO()};
    DB.users.push(u);
    if(su.role==='patient'){const pid=uid('pat');DB.patients.push({id:pid,userId:u.id,nom:su.nom,dateNaissance:'',groupeSanguin:'',allergies:[],antecedents:[],membres:[],assurance:null,gps:null,ville:VILLES[0],carteId:'KAY-'+rndInt(1000,9999),codeParrainage:'KAY-REF-'+rndInt(1000,9999),filleuls:[],gains:0,favoris:[]});rec_(pid);}
    if(su.role==='medecin')DB.doctors.push({id:uid('doc'),userId:u.id,nom:'Dr. '+String(su.nom).replace(/^Dr\.?\s*/i,''),specialite:'',tarif:0,langues:['Français'],note:'0.0',nbAvis:0,ville:VILLES[0],verifie:false,enAttenteValidation:true,numeroOrdre:'—',hopital:'',tel:su.tel,bio:'',agenda:[],revenus:0,consultations:0,tauxAnnulation:0,enLigne:true,premium:false});
    if(su.role==='prestataire')DB.providers.push({id:uid('prov'),userId:u.id,nom:su.nom,categorie:'',tarif:0,ville:VILLES[0],note:'0.0',nbAvis:0,verifie:false,enAttenteValidation:true,tel:su.tel,anneesExp:0,bio:'',enLigne:true,missionsRealisees:0});
    saveDB();return u;
  }
};
async function H(p){if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('kay|'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}return 'p:'+btoa(unescape(encodeURIComponent(p)));}

function openForgot(){
  openModal('Mot de passe oublié',`<div id="fgBox"><div class="field"><label>Votre numéro de téléphone</label><input id="fgIdent" placeholder="77 000 00 00"></div>
  <button class="btn btn-primary btn-block" id="fgSend">Recevoir un code</button><div id="fgMsg" style="font-size:12.5px;margin-top:10px"></div></div>`);
  $('fgSend').onclick=async()=>{
    const ident=$('fgIdent').value.trim();if(!ident){$('fgMsg').textContent='Saisissez votre numéro.';return;}
    const r=await KAYAPI.post('/api/auth/reset-request',{ident});
    if(!r.ok){$('fgMsg').innerHTML='<div class="err">'+r.error+'</div>';return;}
    $('fgBox').innerHTML=`<div style="font-size:12.5px;margin-bottom:10px">Si un compte correspond à ce numéro et que l\u2019envoi de SMS est actif, un code valable 15 minutes vous est envoyé. Sans SMS reçu, contactez l\u2019administrateur.</div>
    <div class="field"><label>Code reçu par SMS</label><input id="fgCode" inputmode="numeric" maxlength="6"></div>
    <div class="field"><label>Nouveau mot de passe (10 min., lettres et chiffres)</label><input id="fgPwd" type="password" minlength="10"></div>
    <button class="btn btn-primary btn-block" id="fgOk">Changer le mot de passe</button><div id="fgMsg" style="font-size:12.5px;margin-top:10px"></div>`;
    $('fgOk').onclick=async()=>{
      const pw=$('fgPwd').value;if(!pwdOk(pw)){$('fgMsg').innerHTML='<div class="err">10 caractères minimum, avec lettres et chiffres.</div>';return;}
      const c=await KAYAPI.post('/api/auth/reset-confirm',{ident,code:$('fgCode').value.trim(),password:pw});
      if(!c.ok){$('fgMsg').innerHTML='<div class="err">'+c.error+'</div>';return;}
      closeModal();toast('Mot de passe modifié. Vous pouvez vous connecter.');
    };
  };
}
function showLoginErr(m){$('loginErr').innerHTML=`<div class="err">${m}</div>`;}
function attachLoginEvents(){
  const tr=$('toRegister');if(tr)tr.onclick=()=>{loginMode='register';openAuth('register');};
  const tl=$('toLogin');if(tl)tl.onclick=()=>{loginMode='login';openAuth('login');};
  const rr=$('rgRole');if(rr)rr.onchange=()=>{document.querySelectorAll('.rg-pat').forEach(e=>e.classList.toggle('hidden',rr.value!=='patient'));document.querySelectorAll('.rg-doc').forEach(e=>e.classList.toggle('hidden',rr.value!=='medecin'));document.querySelectorAll('.rg-pro').forEach(e=>e.classList.toggle('hidden',rr.value!=='prestataire'));};
  const tf=$('toForgot');if(tf)tf.onclick=openForgot;
  const f=$('loginForm');if(!f)return;
  f.onsubmit=async e=>{
    e.preventDefault();const fd=Object.fromEntries(new FormData(f));const setup=false,reg=loginMode==='register';
    const ident=String(fd.ident||'').trim(),pwd=fd.password||'';
    if(!setup&&!reg){
      const sr=await KAYAPI.post('/api/auth/login',{ident,password:pwd});
      if(!sr.ok){showLoginErr(sr.error);return;}
      const u=KAYAPI.mirror(sr.user);
      if(DB.settings.maintenance&&u.role!=='admin'){showLoginErr('🔧 '+(DB.settings.maintenanceMsg||'Maintenance en cours.'));return;}
      if(u.actif===false){showLoginErr('Ce compte est suspendu. Contactez l\'administrateur.');return;}
      if(u.token)notify(u.id,'🔐 Nouvelle connexion ('+uaShort()+'). L\'ancienne session a été fermée.');
      u.token=uid('s');(u.logins=u.logins||[]).unshift({d:new Date().toISOString(),ua:uaShort()});u.logins.length=Math.min(u.logins.length,6);saveDB();
      SESSION={userId:u.id,role:u.role,tok:u.token,srv:true};saveSession();await syncAppts(true);VIEW='dashboard';toast('Bienvenue '+u.nom+' !');render();return;

    if(!nom||!/^\+?\d{8,15}$/.test(tel)){showLoginErr('Nom et numéro de téléphone valides requis.');return;}
    if(!pwdOk(pwd)){showLoginErr('Mot de passe : 10 caractères minimum, avec lettres et chiffres.');return;}
    const srvReg=await KAYAPI.post('/api/auth/register',{nom,tel,email:email||undefined,password:pwd,role:fd.role,consent:true});
    if(!srvReg.ok){showLoginErr(srvReg.error);return;}
    window.__srvPending=srvReg.user.status==='pending';
    if(DB.users.some(x=>x.tel===tel||(email&&x.email===email))){showLoginErr('Un profil local existe déjà pour ce numéro.');return;}
    const role=fd.role,id=uid('u'),ville=fd.ville||VILLES[0];
    if(!setup&&(DB.settings.inscriptions||{})[role]===false){showLoginErr('Les inscriptions ne sont pas ouvertes pour ce profil.');return;}
    let photo='';try{photo=await imgToData(fd.photo);}catch(_){if(!setup){showLoginErr('Une photo de profil (image) est obligatoire.');return;}}
    let dipl=null;if(role==='medecin'){if(!String(fd.hopital||'').trim()){showLoginErr('Indiquez l\'hôpital ou la structure où vous exercez.');return;}if(!fd.diplome||!fd.diplome.size){showLoginErr('Joignez votre diplôme (PDF ou image) : il sera vérifié par l\'administrateur.');return;}try{dipl=await KAY.prepareDiploma(fd.diplome,nom);}catch(er){showLoginErr(er.message||'Diplôme invalide.');return;}}
    DB.users.push({id,role,nom:role==='medecin'?'Dr. '+nom.replace(/^Dr\.?\s*/i,''):nom,tel,email,sid:srvReg.user.id,pwd:'',actif:true,created:todayISO(),photo,statut:(setup||role!=='medecin')?'approuvé':'en attente',carte:setup?nextCard('admin'):(role!=='medecin'?nextCard(role):''),carteDate:(setup||role!=='medecin')?todayISO():''});
    if(setup){DB.settings.emailAdmin=email;DB.settings.telAdmin=tel;}
    if(role==='patient'){
      const pid=uid('pat');DB.patients.push({id:pid,userId:id,nom,dateNaissance:'',groupeSanguin:'',allergies:[],antecedents:[],membres:[],assurance:null,gps:null,ville,carteId:'KAY-'+rndInt(1000,9999),codeParrainage:'KAY-REF-'+rndInt(1000,9999),filleuls:[],gains:0,favoris:[]});rec_(pid);
      const code=String(fd.parrain||'').trim().toUpperCase();const par=code&&DB.patients.find(p=>p.codeParrainage===code);
      if(par){par.filleuls.push({nom,date:todayISO(),statut:'inscrit'});par.gains=(par.gains||0)+500;notify(par.userId,'🎁 '+nom+' s\'est inscrit avec votre code : +500 FCFA');}
    }
    if(role==='medecin'){DB.doctors.push({id:uid('doc'),userId:id,nom:'Dr. '+nom.replace(/^Dr\.?\s*/i,''),specialite:fd.spec,tarif:+fd.tarifD||0,langues:['Français'],note:'0.0',nbAvis:0,ville,verifie:false,enAttenteValidation:true,numeroOrdre:fd.ordre||'—',hopital:String(fd.hopital||'').trim(),tel,bio:'',agenda:[],revenus:0,consultations:0,tauxAnnulation:0,enLigne:true,premium:false});}
    if(role==='prestataire'){DB.providers.push({id:uid('prov'),userId:id,nom,categorie:fd.cat,tarif:+fd.tarifP||0,ville,note:'0.0',nbAvis:0,verifie:true,enAttenteValidation:false,tel,anneesExp:+fd.exp||0,bio:'',enLigne:true,missionsRealisees:0});}
    if(dipl)await KAY.saveDiploma(dipl,id);
    if(role!=='admin'){const LB={patient:'Patient',medecin:'Médecin',prestataire:'Prestataire',pharmacien:'Pharmacien'}[role];admins().forEach(a=>notify(a.id,role==='medecin'?'🩺 CANDIDATURE MÉDECIN à vérifier : '+nom+' — '+String(fd.hopital||'').trim()+' (diplôme joint)':'🆕 Nouvelle inscription '+LB+' : '+nom+' ('+tel+')'));notify(id,role==='medecin'?'📨 Candidature reçue. L\'administrateur vérifie votre diplôme et votre hôpital : vous serez notifié de sa décision.':'🎉 Bienvenue sur Kayligey ! Votre compte est actif'+(role==='patient'?' : prenez rendez-vous avec un médecin.':'.'));}
    const nu=userOf(id);saveDB();
    if(window.__srvPending){loginMode='login';closeModal&&closeModal();toast('Compte créé. Il sera activé après vérification par un administrateur.');render();return;}
    const lg=await KAYAPI.post('/api/auth/login',{ident:tel,password:pwd});
    if(!lg.ok){loginMode='login';toast('Compte créé. Connectez-vous.');render();return;}
    nu.token=uid('s');nu.logins=[{d:new Date().toISOString(),ua:uaShort()}];saveDB();SESSION={userId:id,role,tok:nu.token,srv:true};saveSession();VIEW='dashboard';loginMode='login';toast(role==='medecin'?'Candidature envoyée : l\'administrateur va vérifier votre diplôme.':'Compte créé. Bienvenue sur Kayligey !');render();
  };
}

  openModal('Paiement',`<div style="font-size:13.5px;color:var(--ink-600);margin-bottom:12px;">${label}</div><div style="font-family:'Fraunces',serif;font-size:22px;margin-bottom:16px;">Montant : ${fmoney(amount)}</div>
  <div class="pay-method wave" data-pay="Wave"><div class="ic">💚</div><div><b>Wave</b></div></div><div class="pay-method om" data-pay="Orange Money"><div class="ic">🟠</div><div><b>Orange Money</b></div></div>`);
  document.querySelectorAll('[data-pay]').forEach(el=>el.onclick=()=>{const m=el.dataset.pay;
    openModal('Paiement via '+m,`<p style="font-size:13.5px;color:var(--ink-600)">1. Envoyez <b>${fmoney(amount)}</b> via ${m} au <b>${DB.settings.telPaiement}</b>.<br>2. Saisissez la référence de la transaction reçue par SMS.<br>3. L'administrateur vérifie et confirme votre paiement.</p>
    <div class="field"><label>Référence de transaction</label><input id="payRef" placeholder="Ex : TX123456"></div><button class="btn btn-primary btn-block" id="paySend">Envoyer ma preuve de paiement</button>`);
    $('paySend').onclick=()=>{const ref=$('payRef').value.trim();if(ref.length<4){toast('Référence invalide.','err');return;}
      DB.payments.push({id:uid('pay'),userId:SESSION.userId,userNom:currentUser().nom,montant:amount,methode:m,ref,label,date:todayISO(),statut:'à vérifier'});
      admins().forEach(a=>notify(a.id,'💰 Paiement à vérifier : '+fmoney(amount)+' ('+m+') de '+currentUser().nom));saveDB();closeModal();onSuccess(m,ref);};});
}
function setPayStatus(ref,st){DB.appointments.forEach(a=>{if(a.paiement&&a.paiement.txId===ref)a.paiement.statut=st;});DB.serviceOrders.forEach(o=>{if(o.paiement&&o.paiement.txId===ref)o.paiement.statut=st;});DB.pharmacyOrders.forEach(o=>{if(o.txId===ref)o.payStatut=st;});}

/* ---------- messagerie ---------- */
function chatContacts(){const u=currentUser(),r=SESSION.role,m=new Map(),add=i=>{const x=userOf(i);if(x&&x.id!==u.id)m.set(x.id,x);};
  if(r==='patient'){const p=currentPatient();DB.appointments.filter(a=>a.patientId===p.id).forEach(a=>{const d=DB.doctors.find(z=>z.id===a.doctorId);d&&add(d.userId);});DB.serviceOrders.filter(o=>o.patientId===p.id).forEach(o=>{const q=DB.providers.find(z=>z.id===o.providerId);q&&add(q.userId);});DB.missions.filter(x=>x.patientId===p.id).forEach(x=>x.devis.forEach(dv=>{const q=DB.providers.find(z=>z.id===dv.providerId);q&&add(q.userId);}));}
  if(r==='medecin'){const d=currentDoctor();DB.appointments.filter(a=>a.doctorId===d.id).forEach(a=>{const p=patOf(a.patientId);p&&add(p.userId);});}
  if(r==='prestataire'){const q=currentProvider();DB.serviceOrders.filter(o=>o.providerId===q.id).forEach(o=>{const p=patOf(o.patientId);p&&add(p.userId);});DB.missions.filter(x=>x.devis.some(dv=>dv.providerId===q.id)).forEach(x=>{const p=patOf(x.patientId);p&&add(p.userId);});}
  DB.messages.filter(x=>x.from===u.id||x.to===u.id).forEach(x=>add(x.from===u.id?x.to:x.from));return [...m.values()];}
function messagesView(){
  const u=currentUser(),cs=chatContacts();let w=window.__chatWith;if(w&&!cs.find(c=>c.id===w)&&userOf(w))cs.unshift(userOf(w));if(!cs.find(c=>c.id===w))w=cs[0]&&cs[0].id;window.__chatWith=w;
  if(!cs.length)return `<div class="card empty"><div class="ic">💬</div>Aucune conversation. Les échanges apparaissent après un rendez-vous ou une réservation.</div>`;
  const msgs=DB.messages.filter(m=>(m.from===u.id&&m.to===w)||(m.from===w&&m.to===u.id)).sort((a,b)=>a.date.localeCompare(b.date));
  let ch=false;msgs.forEach(m=>{if(m.to===u.id&&!m.lu){m.lu=true;ch=true;}});if(ch)saveDB();
  const peer=userOf(w);setTimeout(()=>{const b=$('chatMsgs');if(b)b.scrollTop=b.scrollHeight;},20);
  return `<div class="grid g-side"><div class="card chatwin"><h3>${peer.nom}</h3><div class="chat-msgs" id="chatMsgs">${msgs.map(m=>`<div class="bubble ${m.from===u.id?'me':'them'}">${m.text}<div style="font-size:10px;opacity:.6;margin-top:3px">${new Date(m.date).toLocaleString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div></div>`).join('')||'<div class="empty"><div class="ic">💬</div>Démarrez la conversation.</div>'}</div>
  <div class="chat-input"><input id="chatIn" placeholder="Écrire un message..." style="padding:10px;border:1.5px solid var(--line);border-radius:9px"><button class="btn btn-primary" data-a="send">Envoyer</button></div></div>
  <div class="card"><h3>Conversations</h3><div class="row-list">${cs.map(c=>{const un=DB.messages.filter(m=>m.from===c.id&&m.to===u.id&&!m.lu).length;return `<div class="rowc" style="cursor:pointer;${c.id===w?'border-color:var(--teal-500)':''}" data-a="chat" data-id="${c.id}">${avHtml(c.id,c.nom.replace('Dr. ','')[0],'av')}<div class="info"><div class="t1">${c.nom}</div><div class="t2">${c.role}</div></div>${un?`<span class="pill clay">${un}</span>`:''}</div>`;}).join('')}</div></div></div>`;
}
function patientMessages(){return messagesView();}
function sendMsg(){const t=$('chatIn');if(!t||!t.value.trim()||!window.__chatWith)return;const u=currentUser();
  DB.messages.push({id:uid('msg'),from:u.id,to:window.__chatWith,text:t.value.trim(),date:new Date().toISOString(),lu:false});
  const tx='💬 Nouveau message de '+u.nom;if(!DB.notifications.some(n=>n.userId===window.__chatWith&&!n.lu&&n.text===tx))notify(window.__chatWith,tx);saveDB();render();setTimeout(()=>{const i=$('chatIn');if(i)i.focus();},30);}

/* ---------- SOS ---------- */
function sendSOS(){
  // Kayligey n'a AUCUN service de réception d'alertes : on n'enregistre ni n'« envoie » rien. On aide à appeler les secours et à prévenir un proche depuis le téléphone de la personne.
  openModal('🆘 Urgence',`<p style="font-size:14px"><b>Kayligey ne transmet aucune alerte aux secours.</b> En cas de danger vital, appelez immédiatement :</p>
  <div class="xrow" style="display:flex;gap:8px"><a class="btn btn-clay" style="text-decoration:none;flex:1" href="tel:1515">SAMU 1515</a><a class="btn btn-outline" style="text-decoration:none;flex:1" href="tel:18">Pompiers 18</a></div>
  <h4 style="margin:14px 0 6px">Où êtes-vous ?</h4><p id="sosPos" role="status" style="font-size:14px;margin:0 0 6px">Position non partagée. Donnez votre adresse ou un repère aux secours.</p>
  <button type="button" class="btn btn-outline" onclick="sosLocate()">Utiliser ma position</button>
  <label style="display:block;margin-top:8px">Ou écrivez où vous êtes<br><input id="sosAdr" maxlength="200" style="width:100%" autocomplete="off"></label>
  <h4 style="margin:14px 0 6px">Prévenir un proche</h4><label>Numéro du proche<br><input id="sosTel" inputmode="tel" maxlength="20" autocomplete="off"></label>
  <p style="margin:8px 0"><button type="button" class="btn btn-outline" onclick="sosSms()">Préparer un SMS</button></p><p style="font-size:12px;opacity:.8">Le SMS s'ouvre dans l'application de votre téléphone : vous le relisez et vous l'envoyez vous-même.</p>`);
}
function sosLocate(){
  const el=document.getElementById('sosPos');if(!el)return;
  if(!navigator.geolocation){el.textContent='Position indisponible sur cet appareil. Écrivez votre adresse ci-dessous.';return;}
  el.textContent='Recherche de votre position…';
  navigator.geolocation.getCurrentPosition(p=>{window.__sosPos=p.coords.latitude.toFixed(5)+','+p.coords.longitude.toFixed(5);el.textContent='Position trouvée : '+window.__sosPos+' (précision environ '+Math.round(p.coords.accuracy)+' m). Communiquez-la aux secours.';},
    ()=>{el.textContent='Position non autorisée ou introuvable. Écrivez votre adresse ci-dessous ou donnez un repère aux secours.';},{enableHighAccuracy:true,timeout:15000,maximumAge:30000});
}
function sosSms(){
  const t=(document.getElementById('sosTel')||{}).value||'',n=String(t).replace(/[\s.\-()]/g,'').replace(/^\+?221/,'');
  if(!/^7[05678]\d{7}$/.test(n))return toast('Numéro de téléphone sénégalais invalide.','error');
  const adr=((document.getElementById('sosAdr')||{}).value||'').trim(),pos=window.__sosPos?'https://www.google.com/maps?q='+window.__sosPos:'';
  const body='URGENCE : j\'ai besoin d\'aide.'+(adr?' Je suis ici : '+adr+'.':'')+(pos?' Ma position : '+pos:'');
  window.location.href='sms:+221'+n+'?&body='+encodeURIComponent(body);
}

/* ---------- ordonnances -> pharmacie ---------- */
function orderRx(id){const p=currentPatient(),o=rec_(p.id).ordonnances.find(x=>x.id===id);if(!o)return;
  const items=[];let miss=false;o.medicaments.forEach(m=>{const k=m.nom.toLowerCase().split(' ')[0],c=DB.catalogue.find(x=>x.nom.toLowerCase().startsWith(k));if(c)items.push({nom:c.nom,qte:1,prix:c.prix});else{miss=true;items.push({nom:m.nom,qte:1,prix:0});}});
  const total=items.reduce((s,i)=>s+i.prix,0);
  if(miss){DB.pharmacyOrders.push({id:uid('cmd'),patientId:p.id,date:todayISO(),items,total:0,statut:'à chiffrer',paiement:'—'});admins().forEach(a=>notify(a.id,'💊 Commande à chiffrer de '+p.nom));saveDB();toast('Commande envoyée : la pharmacie vous contactera pour le prix.');render();return;}
  openPaymentModal(total,'Ordonnance — '+items.map(i=>i.nom).join(', '),(m,ref)=>{DB.pharmacyOrders.push({id:uid('cmd'),patientId:p.id,date:todayISO(),items,total,statut:'en préparation',paiement:m,txId:ref,payStatut:'à vérifier'});saveDB();toast('Commande enregistrée.');render();});}

function doctorAgenda(d){
  const days=[...Array(14).keys()].map(o=>todayISO(o));
  return `<div class="sec-title" style="margin-top:0"><h2>Mes disponibilités</h2><div class="actions"><button class="btn btn-outline btn-sm" data-a="weektype">Semaine type (lun–ven)</button><button class="btn btn-gold btn-sm" data-a="slotadd">+ Créneaux</button></div></div>

function addSlots(d,date,from,to,step){let n=0;const tm=s=>{const [h,m]=s.split(':').map(Number);return h*60+m;},fm=x=>String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0');
  for(let t=tm(from);t+step<=tm(to);t+=step){const h=fm(t);if(!d.agenda.some(a=>a.date===date&&a.heure===h)){d.agenda.push({date,heure:h,statut:'disponible'});n++;}}return n;}

/* ---------- actions (délégation) ---------- */
const dlFile=(name,txt,type)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click();};
const csvOf=rows=>'\ufeff'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='chatIn')sendMsg();});
document.addEventListener('input',e=>{if(e.target.id==='uq'){window.__uq=e.target.value;const p=e.target.selectionStart;render();const i=$('uq');if(i){i.focus();i.setSelectionRange(p,p);}}});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.dataset&&t.dataset.a==='ostat'){const o=DB.pharmacyOrders.find(x=>x.id===t.dataset.id);o.statut=t.value;const p=patOf(o.patientId);if(p)notify(p.userId,'💊 Votre commande est : '+t.value);saveDB();toast('Statut mis à jour.');}
  if(t.id==='impDB'&&t.files[0]){try{const o=JSON.parse(await t.files[0].text());if(!Array.isArray(o.users))throw 0;DB=o;ensureDB();saveDB();SESSION=null;localStorage.removeItem(SESSION_KEY);toast('Sauvegarde importée. Reconnectez-vous.');render();}catch(_){toast('Fichier de sauvegarde invalide.','err');}}
  if(t.id==='xdoc'){/* géré par l'extension */}
});
document.addEventListener('click',async ev=>{
  const as=ev.target.closest('#addAssurance');if(as){openModal('Assurance / mutuelle',`<div class="field"><label>Compagnie</label><input id="asC"></div><div class="field"><label>N° adhérent</label><input id="asN"></div><div class="field"><label>Taux de remboursement (%)</label><input id="asT" type="number" value="80"></div><button class="btn btn-primary btn-block" id="asS">Enregistrer</button>`);
    $('asS').onclick=()=>{const c=$('asC').value.trim();if(!c)return;currentPatient().assurance={compagnie:c,numero:$('asN').value,tauxRemboursement:+$('asT').value||0};saveDB();closeModal();render();};return;}
  const b=ev.target.closest('[data-a]');if(!b||b.tagName==='SELECT')return;const a=b.dataset.a,id=b.dataset.id,i=b.dataset.i,v=k=>$(k)?$(k).value.trim():'';
  if(a==='chat'){window.__chatWith=id;render();}
  else if(a==='send')sendMsg();
  else if(a==='chatappt'){const ap=DB.appointments.find(x=>x.id===id),other=SESSION.role==='patient'?(DB.doctors.find(d=>d.id===ap.doctorId)||{}).userId:(patOf(ap.patientId)||{}).userId;window.__chatWith=other;navigate('messages');}
  else if(a==='slot'){const d=currentDoctor(),s=d.agenda.find(x=>x.date===b.dataset.d&&x.heure===b.dataset.h);if(s.statut==='réservé'){toast('Créneau réservé par un patient.');return;}s.statut=s.statut==='bloqué'?'disponible':'bloqué';saveDB();render();}
  else if(a==='slotadd'){openModal('Ajouter des créneaux',`<div class="field"><label>Date</label><input id="saD" type="date" min="${todayISO()}" value="${todayISO()}"></div><div class="grid g2"><div class="field"><label>De</label><input id="saF" type="time" value="09:00"></div><div class="field"><label>À</label><input id="saT" type="time" value="12:00"></div></div><div class="field"><label>Durée (min)</label><select id="saS"><option>20</option><option selected>30</option><option>45</option><option>60</option></select></div><button class="btn btn-primary btn-block" id="saOk">Créer</button>`);
    $('saOk').onclick=()=>{const n=addSlots(currentDoctor(),$('saD').value,$('saF').value,$('saT').value,+$('saS').value);saveDB();closeModal();toast(n+' créneau(x) ajouté(s).');render();};}
  else if(a==='weektype'){const d=currentDoctor();let n=0;for(let o=0;o<7;o++){const dt=new Date();dt.setDate(dt.getDate()+o);const w=dt.getDay();if(w>0&&w<6){const day=todayISO(o);n+=addSlots(d,day,'09:00','12:00',60)+addSlots(d,day,'14:00','17:00',60);}}saveDB();toast(n+' créneau(x) ajouté(s).');render();}
  else if(a==='rec'){const p=patOf(id),r=rec_(id),v=r.vitals.slice(-1)[0];openModal('Dossier — '+p.nom,`<table><tr><td>Naissance</td><td>${p.dateNaissance||'—'}</td></tr><tr><td>Groupe sanguin</td><td>${p.groupeSanguin||'—'}</td></tr><tr><td>Allergies</td><td>${(p.allergies||[]).join(', ')||'Aucune connue'}</td></tr><tr><td>Antécédents</td><td>${(p.antecedents||[]).join(', ')||'Aucun'}</td></tr><tr><td>Dernières constantes</td><td>${v?`Tension ${v.tension} · Glycémie ${v.glycemie} · ${v.poids} kg`:'—'}</td></tr></table><h3 style="margin:14px 0 6px">Consultations</h3>${r.consultations.map(c=>`<div class="rowc" style="margin-bottom:6px"><div class="info"><div class="t1">${c.motif} — ${fdate(c.date)}</div><div class="t2">${c.doctorNom} : ${c.diagnostic}</div></div></div>`).join('')||'<div class="empty" style="padding:10px">Aucune.</div>'}`);}
  else if(a==='rxsave'){const pid=v('rxPat');if(!pid){toast('Aucun patient sélectionné.','err');return;}const noms=[...document.querySelectorAll('.rxNom')].map(x=>x.value.trim()),po=[...document.querySelectorAll('.rxPoso')].map(x=>x.value.trim()),meds=noms.map((n,k)=>n?{nom:n,posologie:po[k]||'Selon prescription'}:null).filter(Boolean);
    if(!meds.length){toast('Ajoutez au moins un médicament.','err');return;}const d=currentDoctor();rec_(pid).ordonnances.push({id:uid('rx'),date:todayISO(),doctorId:d.id,doctorNom:d.nom,medicaments:meds});notify(patOf(pid).userId,'📝 Nouvelle ordonnance de '+d.nom);saveDB();toast('Ordonnance envoyée au patient.');render();}
  else if(a==='csvappts'){const d=currentDoctor();dlFile('rendez-vous.csv',csvOf([['Date','Heure','Patient','Type','Statut','Motif']].concat(DB.appointments.filter(x=>x.doctorId===d.id).map(x=>[x.date,x.heure,x.patientNom,x.type,x.statut,x.motif]))),'text/csv');}
  else if(a==='vacadd'){openModal('Ajouter un vaccin',`<div class="field"><label>Vaccin</label><input id="vcN"></div><div class="field"><label>Date</label><input id="vcD" type="date" value="${todayISO()}"></div><button class="btn btn-primary btn-block" id="vcS">Ajouter</button>`);$('vcS').onclick=()=>{if(!v('vcN'))return;rec_(currentPatient().id).vaccins.push({nom:v('vcN'),date:v('vcD')});saveDB();closeModal();render();};}
  else if(a==='vacdel'){rec_(currentPatient().id).vaccins.splice(+i,1);saveDB();render();}
  else if(a==='savepat'){const u=currentUser(),p=currentPatient(),tel=nt(v('pfTel'));if(DB.users.some(x=>x.id!==u.id&&(x.tel===tel||(v('pfEmail')&&x.email===v('pfEmail').toLowerCase())))){toast('Téléphone ou e-mail déjà utilisé.','err');return;}
    u.nom=v('pfNom')||u.nom;u.tel=tel||u.tel;u.email=v('pfEmail').toLowerCase();p.nom=u.nom;p.ville=v('pfVille');p.dateNaissance=v('pfDob');p.groupeSanguin=v('pfBlood');p.allergies=v('pfAll').split(',').map(s=>s.trim()).filter(Boolean);p.antecedents=v('pfAnt').split(',').map(s=>s.trim()).filter(Boolean);saveDB();toast('Profil mis à jour.');render();}
  else if(a==='savedoc'){const d=currentDoctor();d.specialite=v('dpSpec');d.tarif=+v('dpTarif')||0;d.ville=v('dpVille');d.langues=v('dpLang').split(',').map(s=>s.trim()).filter(Boolean);d.bio=v('dpBio');saveDB();toast('Profil enregistré.');render();}
  else if(a==='savepro'){const p=currentProvider();p.categorie=v('ppCat');p.tarif=+v('ppTarif')||0;p.ville=v('ppVille');p.anneesExp=+v('ppExp')||0;p.bio=v('ppBio');saveDB();toast('Profil enregistré.');render();}
  else if(a==='saveadm'){const u=currentUser();u.nom=v('adNom')||u.nom;u.email=v('adEmail').toLowerCase();saveDB();toast('Profil enregistré.');render();}
  else if(a==='chpwd'){const n=$('pwNew').value;if(!pwdOk(n)){toast('10 caractères minimum avec lettres et chiffres.','err');return;}const r=await KAYAPI.post('/api/auth/change-password',{current:$('pwOld').value,password:n});if(!r.ok){toast(r.error,'err');return;}toast('Mot de passe modifié. Vos autres appareils ont été déconnectés.');render();}
  else if(a==='tkadd'){const s=v('tkSujet'),m=v('tkMsg'),u=currentUser();if(!s||!m){toast('Sujet et message requis.','err');return;}
    if($('tkType').value==='litige')DB.litiges.push({id:uid('lt'),sujet:s,description:m+' — '+u.nom+' ('+u.tel+')',date:todayISO(),statut:'ouvert'});
    else DB.tickets.push({id:uid('tk'),userId:u.id,userNom:u.nom,role:u.role,sujet:s,message:m,date:new Date().toISOString(),statut:'ouvert',reponses:[]});

  else if(a==='tkrep'){const t=DB.tickets.find(x=>x.id===id),tx=v('rp_'+id);if(!tx)return;t.reponses.push({de:'Support',texte:tx,date:new Date().toISOString()});notify(t.userId,'🎫 Réponse du support : '+t.sujet);saveDB();render();}
  else if(a==='tkclose'){DB.tickets.find(x=>x.id===id).statut='fermé';saveDB();render();}
  else if(a==='sosdone'){DB.alertes.find(x=>x.id===id).statut='traitée';saveDB();render();}
  else if(a==='payok'||a==='payko'){const p=DB.payments.find(x=>x.id===id);p.statut=a==='payok'?'confirmé':'rejeté';setPayStatus(p.ref,p.statut);notify(p.userId,(a==='payok'?'✅ Paiement confirmé : ':'❌ Paiement rejeté : ')+fmoney(p.montant)+' — '+p.label);saveDB();toast('Paiement '+p.statut+'.');render();}
  else if(a==='medadd'){const n=v('mdNom'),p=+v('mdPrix');if(!n||!p){toast('Nom et prix requis.','err');return;}DB.catalogue.push({id:uid('md'),nom:n,prix:p});saveDB();render();}
  else if(a==='meddel'){DB.catalogue=DB.catalogue.filter(x=>x.id!==id);saveDB();render();}
  else if(a==='medprice'){const m=DB.catalogue.find(x=>x.id===id),p=prompt('Nouveau prix (FCFA) pour '+m.nom,m.prix);if(p&&+p>0){m.prix=+p;saveDB();render();}}
  else if(a==='ototal'){const o=DB.pharmacyOrders.find(x=>x.id===id),p=prompt('Prix total de la commande (FCFA)');if(p&&+p>0){o.total=+p;o.statut='en préparation';const pt=patOf(o.patientId);if(pt)notify(pt.userId,'💊 Votre commande est chiffrée : '+fmoney(+p)+'. Réglez via Wave/Orange Money au '+DB.settings.telPaiement);saveDB();render();}}
  else if(a==='uspwd'){const u=userOf(id),t=tempPwd();u.pwd=await H(t);u.mustChange=true;u.token='';saveDB();openModal('Mot de passe temporaire',`<p style="font-size:13.5px">Communiquez ce mot de passe à <b>${u.nom}</b>. Il devra le remplacer par un mot de passe personnel à sa prochaine connexion.</p><div class="ref-code">${t}</div>`);}
  else if(a==='ussusp'){const u=userOf(id);u.actif=u.actif===false;saveDB();render();}
  else if(a==='usdel'){if(!confirm('Supprimer définitivement ce compte ?'))return;const u=userOf(id);DB.users=DB.users.filter(x=>x.id!==id);DB.doctors=DB.doctors.filter(x=>x.userId!==id);DB.providers=DB.providers.filter(x=>x.userId!==id);DB.patients=DB.patients.filter(x=>x.userId!==id);saveDB();toast(u.nom+' supprimé.');render();}
  else if(a==='stadd'||a==='stedit'){const s=a==='stedit'?DB.structures.find(x=>x.id===id):{nom:'',ville:VILLES[0],type:'Clinique',lits:0,litsOccupes:0,tel:''};
    openModal(a==='stadd'?'Nouvelle structure':'Modifier la structure',`<div class="field"><label>Nom</label><input id="stN" value="${s.nom}"></div><div class="grid g2"><div class="field"><label>Ville</label><select id="stV">${VILLES.map(x=>`<option ${s.ville===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Type</label><select id="stT">${['Hôpital','Clinique','Centre de santé','Pharmacie'].map(x=>`<option ${s.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Lits</label><input id="stL" type="number" value="${s.lits}"></div><div class="field"><label>Lits occupés</label><input id="stO" type="number" value="${s.litsOccupes}"></div></div><div class="field"><label>Téléphone</label><input id="stP" value="${s.tel||''}"></div><button class="btn btn-primary btn-block" id="stS">Enregistrer</button>`);
    $('stS').onclick=()=>{if(!v('stN'))return;const o=a==='stedit'?s:{id:uid('st'),valide:true};Object.assign(o,{nom:v('stN'),ville:v('stV'),type:v('stT'),lits:+v('stL')||0,litsOccupes:+v('stO')||0,tel:v('stP')});if(a==='stadd')DB.structures.push(o);saveDB();closeModal();render();};}
  else if(a==='stdel'){DB.structures=DB.structures.filter(x=>x.id!==id);saveDB();render();}
  else if(a==='savepay'){DB.settings.telPaiement=nt(v('stTelPay'))||DB.settings.telPaiement;saveDB();toast('Numéro de paiement enregistré.');}
  else if(a==='dlbackup'){dlFile('kayligey-sauvegarde-'+todayISO()+'.json',JSON.stringify(DB),'application/json');}
});

function nextCard(role){const s=DB.settings;s.cardSeq=(s.cardSeq||0)+1;return 'KAY-'+({patient:'P',medecin:'M',prestataire:'S',admin:'A'}[role]||'X')+'-'+String(s.cardSeq).padStart(5,'0');}
function imgToData(file){return new Promise((res,rej)=>{if(!file||!file.size||!/^image\//.test(file.type))return rej();const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=256;c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,256,256);res(c.toDataURL('image/jpeg',0.8));};im.onerror=rej;im.src=r.result;};r.onerror=rej;r.readAsDataURL(file);});}
function avHtml(uid_,txt,cls){const u=userOf(uid_);return u&&u.photo?`<div class="${cls}" style="background:url(${u.photo}) center/cover no-repeat"></div>`:`<div class="${cls}">${txt}</div>`;}
