function gateHtml(ic,t,m,u){const s=DB.settings;return `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--sand-50)"><div class="card" style="max-width:470px;text-align:center;padding:34px"><div style="font-size:44px">${ic}</div><h2 style="margin:10px 0">${t}</h2><p style="color:var(--ink-600);line-height:1.6">${m}</p>${(s.supportTel||s.supportEmail)?`<p style="font-size:13px">Contact : ${s.supportTel||''} ${s.supportEmail||''}</p>`:''}<button class="btn btn-outline" id="gateOut" style="margin-top:14px">Se déconnecter</button></div></div>`;}
function gate(h){$('app').innerHTML=h;const l=$('gateOut');if(l)l.onclick=()=>{KAYAPI.logout();const uu=SESSION&&userOf(SESSION.userId);if(uu){uu.token='';saveDB();}SESSION=null;localStorage.removeItem(SESSION_KEY);VIEW='login';render();};}
const _render0=render;
render=function(){
  if(SESSION&&$('loginForm'))closeModal();
  const fab0=document.querySelector('.ext-fab');if(fab0)document.body.appendChild(fab0);
  document.title=(DB.settings.siteName||'Kayligey')+' — '+(DB.settings.slogan||'');
  if(SESSION){const u=userOf(SESSION.userId);
    if(!u||u.actif===false){SESSION=null;localStorage.removeItem(SESSION_KEY);}
    else if(u.token&&SESSION.tok!==u.token){SESSION=null;localStorage.removeItem(SESSION_KEY);setTimeout(()=>toast('Votre compte vient d\'être ouvert sur un autre appareil. Un compte = une seule personne.','err'),50);}
    else if(u.mustChange){gate(pwdGateHtml());return;}
    else if(u.role!=='admin'){
      if(DB.settings.maintenance){gate(gateHtml('🔧','Maintenance en cours',DB.settings.maintenanceMsg,u));return;}
      if(u.statut!=='approuvé'){gate(u.statut==='refusé'?gateHtml('⛔','Demande refusée',u.motif||'Votre demande n\'a pas été acceptée.',u):gateHtml('⏳','Demande en cours d\'examen','Votre inscription est bien reçue. L\'administrateur doit l\'accepter : vous recevrez alors votre carte Kayligey et l\'accès complet à la plateforme.',u));return;}
    }}
  _render0();
  const tb=document.querySelector('.topbar > div:last-child, .lp-tools'),fab1=document.querySelector('.ext-fab');if(tb&&fab1)tb.prepend(fab1);
  if(!SESSION)return;const m=document.querySelector('.main');if(!m)return;const u=currentUser();let top='';
  if(u.role==='admin'&&DB.settings.maintenance)top+='<div class="maint-banner" style="border-radius:10px;margin-bottom:14px">🔧 Maintenance active : seuls les administrateurs peuvent se connecter.</div>';
  if(DB.settings.announcement)top+=`<div class="err" style="background:var(--gold-100);color:var(--gold-600)">📢 ${DB.settings.announcement}</div>`;
  if(top)m.insertAdjacentHTML('afterbegin',top);
  const un=DB.messages.filter(x=>x.to===u.id&&!x.lu).length,nb=document.querySelector('[data-nav="messages"]');
  if(nb&&un)nb.insertAdjacentHTML('beforeend',`<span class="pill clay" style="margin-left:auto">${un}</span>`);
};

function donut(d){

}

  const P=v.map((x,i)=>[10+i*280/n,100-(x-mn)/(mx-mn||1)*80]),line=P.map(p=>p.join(',')).join(' '),id='g'+Math.random().toString(36).slice(2,6);
  return `<svg viewBox="0 0 300 130" style="width:100%"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".35"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs><polygon points="10,100 ${line} ${P[P.length-1][0]},100" fill="url(#${id})"/><polyline points="${line}" fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round"/>${P.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#e0a91a"/><text x="${p[0]}" y="118" text-anchor="middle" ${T}>${l[i]||''}</text>`).join('')}</svg>`;

(function(){

/* ---------- utilitaires ---------- */
const esc=s=>String(s==null?'':s).replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const unesc=s=>String(s==null?'':s).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
const u8=s=>{const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i)&255;return a;};
const fsize=n=>n>1048576?(n/1048576).toFixed(1)+' Mo':Math.max(1,Math.round(n/1024))+' Ko';
const norm=s=>unesc(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const nowISO=()=>new Date().toISOString();
const readAB=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('Lecture du fichier impossible.'));r.readAsArrayBuffer(f);});

function b64(buf){const b=new Uint8Array(buf);let s='';for(let i=0;i<b.length;i+=8192)s+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(s);}

 {n:'Syndrome grippal',m:[['Paracétamol 500mg','1 comprimé x3/jour','3 jours'],['Vitamine C','1 comprimé/jour','10 jours']]},
 {n:'Paludisme simple',m:[['Artesunate-Amodiaquine','selon poids, 1 prise/jour','3 jours'],['Paracétamol 500mg','1 comprimé si fièvre','3 jours']]},
 {n:'Infection bactérienne',m:[['Amoxicilline 500mg','1 gélule x3/jour','7 jours'],['Paracétamol 500mg','1 comprimé si douleur','5 jours']]},
 {n:'Douleur / inflammation',m:[['Paracétamol 500mg','1 comprimé x3/jour','5 jours'],['Oméprazole 20mg','1 gélule le matin à jeun','7 jours']]}
];

/* ---------- stockage des fichiers (IndexedDB, repli localStorage / mémoire) ---------- */
const FS={db:null,mem:{},ready:null,
 open(){if(!this.ready)this.ready=new Promise(res=>{try{if(typeof indexedDB==='undefined'||!indexedDB)return res(false);const rq=indexedDB.open('kayligey_files',1);rq.onupgradeneeded=()=>{try{rq.result.createObjectStore('f');}catch(_){}};rq.onsuccess=()=>{FS.db=rq.result;res(true);};rq.onerror=()=>res(false);rq.onblocked=()=>res(false);}catch(_){res(false);}});return this.ready;},
 async put(id,buf){this.mem[id]=buf;await this.open();
  if(this.db){const ok=await new Promise(res=>{try{const tx=this.db.transaction('f','readwrite');tx.objectStore('f').put(buf,id);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);tx.onabort=()=>res(false);}catch(_){res(false);}});if(ok){delete this.mem[id];return 'idb';}}
  try{localStorage.setItem('kayfile_'+id,b64(buf));delete this.mem[id];return 'ls';}catch(_){}
  return 'mem';},
 async get(id){if(this.mem[id])return this.mem[id];await this.open();
  if(this.db){const r=await new Promise(res=>{try{const rq=this.db.transaction('f').objectStore('f').get(id);rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>res(null);}catch(_){res(null);}});if(r)return r;}
  const s=localStorage.getItem('kayfile_'+id);if(s)return unb64(s);return null;},
 async del(id){delete this.mem[id];await this.open();try{localStorage.removeItem('kayfile_'+id);}catch(_){}
  if(this.db)await new Promise(res=>{try{const tx=this.db.transaction('f','readwrite');tx.objectStore('f').delete(id);tx.oncomplete=()=>res();tx.onerror=()=>res();tx.onabort=()=>res();}catch(_){res();}});}
};
async function storeFile(bytes,nom,owners){K();const id=uid('fl');const how=await FS.put(id,toAB(bytes));
 DB.files[id]={id,nom:esc(nom),size:bytes.length,mime:'application/pdf',date:nowISO(),owners:[...new Set(owners)],stored:how};
 return {id,nom:esc(nom),size:bytes.length};}
function saveBlob(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);}

/* ---------- générateur de PDF (sans dépendance) ---------- */
const WIN={'œ':'\x9c','Œ':'\x8c','€':'\x80','’':'\x92','‘':'\x91','“':'\x93','”':'\x94','–':'\x96','—':'\x97','…':'\x85','•':'\x95'};
function latin(s){let o='';for(const ch of String(s)){if(WIN[ch]){o+=WIN[ch];continue;}const c=ch.codePointAt(0);o+=c<256?ch:'?';}return o;}
const pesc=s=>latin(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)').replace(/[\r\n]+/g,' ');
function buildPdf(pages,title){
  const objs=[];const add=(...parts)=>{objs.push(parts);return objs.length;};
  add('<< /Type /Catalog /Pages 2 0 R >>');add('');
  add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  const kids=[];
  pages.forEach(pg=>{let xo='';
    if(pg.img){const id=add(`<< /Type /XObject /Subtype /Image /Width ${pg.img.w} /Height ${pg.img.h} /ColorSpace /${pg.img.cs} /BitsPerComponent 8 /Filter /DCTDecode /Length ${pg.img.data.length} >>\nstream\n`,pg.img.data,'\nendstream');xo=`/XObject << /Im1 ${id} 0 R >>`;}
    const cb=u8(pg.content);const cid=add(`<< /Length ${cb.length} >>\nstream\n`,cb,'\nendstream');
    kids.push(add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pg.w} ${pg.h}] /Contents ${cid} 0 R /Resources << /Font << /F1 3 0 R /F2 4 0 R >> ${xo} >> >>`));});
  objs[1]=[`<< /Type /Pages /Count ${kids.length} /Kids [${kids.map(k=>k+' 0 R').join(' ')}] >>`];
  const d=new Date(),z=n=>String(n).padStart(2,'0');
  const info=add(`<< /Title (${pesc(title||'Kayligey')}) /Producer (Kayligey) /Creator (Kayligey) /CreationDate (D:${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}) >>`);
  const out=[];let off=0;const push=x=>{const b=typeof x==='string'?u8(x):x;out.push(b);off+=b.length;};
  push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');const offs=[];
  objs.forEach((parts,i)=>{offs.push(off);push((i+1)+' 0 obj\n');parts.forEach(push);push('\nendobj\n');});
  const xr=off;push(`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join(''));
  push(`trailer\n<< /Size ${objs.length+1} /Root 1 0 R /Info ${info} 0 R >>\nstartxref\n${xr}\n%%EOF`);
  const all=new Uint8Array(off);let p=0;out.forEach(b=>{all.set(b,p);p+=b.length;});return all;}
const PW=595,PH=842,PM=48;
function pdfHeader(){return [`0.075 0.388 0.388 rg 0 ${PH-58} ${PW} 58 re f`,`0.878 0.663 0.102 rg 0 ${PH-62} ${PW} 4 re f`,
  `BT /F2 20 Tf 1 1 1 rg ${PM} ${PH-38} Td (KAYLIGEY) Tj ET`,`BT /F1 9 Tf 0.85 0.93 0.92 rg ${PM+112} ${PH-37} Td (${pesc('Plateforme de télésanté — Sénégal')}) Tj ET`];}
function wrapTxt(t,maxc){const out=[];String(t).split(/\n/).forEach(par=>{let line='';par.split(/\s+/).forEach(w=>{while(w.length>maxc){if(line){out.push(line);line='';}out.push(w.slice(0,maxc));w=w.slice(maxc);}if(!line)line=w;else if((line+' '+w).length<=maxc)line+=' '+w;else{out.push(line);line=w;}});out.push(line);});return out;}
function textPdf(blocks,title){
  const pages=[];let cur,y;const start=()=>{cur=pdfHeader();y=PH-98;};start();
  const fin=()=>{pages.push(cur);start();};
  const ln=(txt,size,bold,x,color)=>{if(y-size<64)fin();cur.push(`BT /${bold?'F2':'F1'} ${size} Tf ${color||'0.09 0.15 0.15'} rg ${x} ${y-size} Td (${pesc(txt)}) Tj ET`);y-=size*1.5;};
  blocks.forEach(b=>{
    if(b.t==='title'){wrapTxt(b.s,Math.floor((PW-2*PM)/(17*.56))).forEach(l=>ln(l,17,true,PM,'0.04 0.17 0.17'));y-=4;}
    else if(b.t==='h'){y-=8;ln(b.s.toUpperCase(),10.5,true,PM,'0.075 0.388 0.388');cur.push(`0.86 0.84 0.78 RG 0.6 w ${PM} ${y+3} m ${PW-PM} ${y+3} l S`);y-=4;}
    else if(b.t==='p'){wrapTxt(b.s,Math.floor((PW-2*PM)/(10.5*.54))).forEach(l=>ln(l,10.5,!!b.b,PM));}
    else if(b.t==='kv'){const lab=b.k+' : ';const mc=Math.floor((PW-2*PM-110)/(10.5*.54));const ls=wrapTxt(b.v||'—',mc);ls.forEach((l,i)=>{if(i===0){if(y-10.5<64)fin();cur.push(`BT /F2 10.5 Tf 0.3 0.37 0.36 rg ${PM} ${y-10.5} Td (${pesc(lab)}) Tj ET`);}ln(l,10.5,false,PM+110);});}
    else if(b.t==='li'){const ls=wrapTxt(b.s,Math.floor((PW-2*PM-22)/(10.5*.54)));ls.forEach((l,i)=>{if(i===0){if(y-10.5<64)fin();cur.push(`BT /F2 10.5 Tf 0.075 0.388 0.388 rg ${PM+4} ${y-10.5} Td (${pesc('•')}) Tj ET`);}ln(l,10.5,i===0&&!!b.b,PM+22);});}
    else if(b.t==='sp')y-=(b.n||8);
    else if(b.t==='hr'){cur.push(`0.86 0.84 0.78 RG 0.6 w ${PM} ${y} m ${PW-PM} ${y} l S`);y-=8;}
  });
  pages.push(cur);const n=pages.length,stamp=new Date().toLocaleString('fr-FR');
  return buildPdf(pages.map((c,i)=>({w:PW,h:PH,content:c.concat([`BT /F1 8 Tf 0.45 0.5 0.5 rg ${PM} 30 Td (${pesc('Document généré par Kayligey le '+stamp)}) Tj ET`,`BT /F1 8 Tf 0.45 0.5 0.5 rg ${PW-PM-50} 30 Td (Page ${i+1} / ${n}) Tj ET`]).join('\n')})),title);}
function jpegInfo(b){if(!b||b[0]!==0xFF||b[1]!==0xD8)return null;let i=2;while(i<b.length-9){if(b[i]!==0xFF){i++;continue;}const m=b[i+1];if(m===0xFF){i++;continue;}if(m===0x01||(m>=0xD0&&m<=0xD9)){i+=2;continue;}const L=(b[i+2]<<8)|b[i+3];if(m>=0xC0&&m<=0xCF&&m!==0xC4&&m!==0xC8&&m!==0xCC)return {h:(b[i+5]<<8)|b[i+6],w:(b[i+7]<<8)|b[i+8],n:b[i+9]};i+=2+L;}return null;}
function imagePdf(jpg,info,caption){
  const hdr=pdfHeader();hdr.push(`BT /F2 11 Tf 0.04 0.17 0.17 rg ${PM} ${PH-84} Td (${pesc(String(caption).slice(0,90))}) Tj ET`);
  const aw=PW-2*PM,ah=PH-150,s=Math.min(aw/info.w,ah/info.h),sw=info.w*s,sh=info.h*s,x=(PW-sw)/2,y=PH-110-sh;
  hdr.push(`q ${sw.toFixed(2)} 0 0 ${sh.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm /Im1 Do Q`);
  hdr.push(`BT /F1 8 Tf 0.45 0.5 0.5 rg ${PM} 30 Td (${pesc('Image convertie en PDF par Kayligey le '+new Date().toLocaleString('fr-FR'))}) Tj ET`);
  return buildPdf([{w:PW,h:PH,content:hdr.join('\n'),img:{w:info.w,h:info.h,cs:info.n===1?'DeviceGray':'DeviceRGB',data:jpg}}],caption);}
function toJpeg(f){return new Promise((res,rej)=>{const url=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{try{const mx=2400;let w=im.naturalWidth,h=im.naturalHeight;const s=Math.min(1,mx/Math.max(w,h));w=Math.max(1,Math.round(w*s));h=Math.max(1,Math.round(h*s));const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);res(u8(atob(c.toDataURL('image/jpeg',.92).split(',')[1])));}catch(e){rej(new Error('Conversion de l\'image impossible.'));}finally{URL.revokeObjectURL(url);}};
  im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Image illisible.'));};im.src=url;});}
async function prepareFile(f,cap){
  if(!f)throw new Error('Aucun fichier sélectionné.');
  if(f.size>10*1024*1024)throw new Error('Fichier trop volumineux (10 Mo maximum).');
  if(f.size<16)throw new Error('Fichier vide ou invalide.');
  const b=new Uint8Array(await readAB(f));
  const base=String(f.name||'document').replace(/\.[^.]+$/,'').replace(/[^\w\-. àâäéèêëîïôöùûüç]/gi,'_').slice(0,60)||'document';
  let head='';for(let i=0;i<Math.min(1024,b.length);i++)head+=String.fromCharCode(b[i]);
  if(head.indexOf('%PDF-')>=0)return {bytes:b,nom:base+'.pdf',size:b.length,converted:false};
  const isImg=/^image\//.test(f.type||'')||/\.(jpe?g|png|gif|webp|bmp)$/i.test(f.name||'');
  if(!isImg)throw new Error('Format non pris en charge : envoyez un PDF ou une image (JPG, PNG).');
  let jb=b,info=jpegInfo(b);
  if(!info||info.n===4||info.n===2){jb=await toJpeg(f);info=jpegInfo(jb);if(!info)throw new Error('Image illisible.');}
  const pdf=imagePdf(jb,info,cap||base);return {bytes:pdf,nom:base+'.pdf',size:pdf.length,converted:true};}

const CLASSES={penicilline:['penicilline','amoxicilline','ampicilline','oxacilline','augmentin','clavulan'],aspirine:['aspirine','acetylsalicylique'],ains:['ibuprofene','diclofenac','ketoprofene','naproxene','aspirine','indometacine'],sulfamide:['sulfamide','cotrimoxazole','sulfametoxazole','bactrim'],cephalosporine:['cefixime','ceftriaxone','cefuroxime','cefalexine','cefadroxil'],paracetamol:['paracetamol','doliprane','efferalgan'],quinine:['quinine','quinimax'],codeine:['codeine','tramadol']};
function allergyHits(p,meds){const al=(p.allergies||[]).map(norm).filter(a=>a.length>=3);if(!al.length)return [];
  return meds.filter(m=>{const n=norm(m.nom);return al.some(a=>{const terms=new Set([a]);Object.keys(CLASSES).forEach(k=>{if(a.includes(k)||(a.length>=4&&k.includes(a)))CLASSES[k].forEach(t=>terms.add(t));});return [...terms].some(t=>n.includes(t));});}).map(m=>m.nom);}

/* ---------- envoi d'un résultat d'examen (patient) ---------- */
function exModal(opt){opt=opt||{};K();const p=currentPatient();if(!p)return;const docs=relDoctors(p);const req=opt.reqId&&DB.exams.find(e=>e.id===opt.reqId);
  if(!docs.length){openModal('Envoyer un résultat d\'examen','<div class="empty"><div class="ic">🩺</div>Aucun médecin associé à votre dossier. Prenez d\'abord rendez-vous pour pouvoir lui transmettre vos examens.</div><button class="btn btn-primary btn-block" data-k="go" data-v="medecins">Trouver un médecin</button>');return;}
  const did=req?req.doctorId:(opt.did||docs[0].id);
  openModal(req?'Envoyer le résultat demandé':'Envoyer un résultat d\'examen',`<div class="field"><label>Médecin destinataire</label><select id="kxDoc" ${req?'disabled':''}>${docs.map(d=>`<option value="${d.id}" ${d.id===did?'selected':''}>${d.nom} — ${d.specialite}</option>`).join('')}</select></div>
  <div class="grid g2"><div class="field"><label>Type d'examen</label><select id="kxType" ${req?'disabled':''}>${EXAM_TYPES.map(t=>`<option ${req&&unesc(req.type)===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>Zone / organe</label><input id="kxZone" maxlength="80" placeholder="Ex. thorax, genou droit" value="${req?req.zone:''}"></div></div>
  <div class="grid g2"><div class="field"><label>Date de l'examen</label><input id="kxDate" type="date" max="${todayISO()}" value="${todayISO()}"></div><div class="field"><label>Centre / établissement</label><input id="kxCentre" maxlength="80" placeholder="Facultatif"></div></div>
  <div class="field"><label>Message pour le médecin</label><textarea id="kxNote" rows="2" maxlength="500" placeholder="Symptômes, questions…"></textarea></div>
  <div class="field"><label>Résultat (PDF ou image)</label><input id="kxFile" type="file" accept="application/pdf,image/*"><div class="k-hint">Les images (radios JPG/PNG) sont converties automatiquement en PDF. 10 Mo maximum.</div></div>
  <div id="kxErr"></div><button class="btn btn-primary btn-block" id="kxGo" data-k="exgo" data-req="${req?req.id:''}">Envoyer au médecin</button>`);}
async function doExSend(reqId){const p=currentPatient();const btn=$('kxGo'),err=m=>{const e=$('kxErr');if(e)e.innerHTML=`<div class="err">${esc(m)}</div>`;toast(m,'err');};
  const d=docOf(reqId?(DB.exams.find(e=>e.id===reqId)||{}).doctorId:$('kxDoc').value);if(!d){err('Choisissez un médecin.');return;}
  const f=$('kxFile').files[0];if(!f){err('Joignez le fichier du résultat (PDF ou image).');return;}
  const type=reqId?unesc((DB.exams.find(e=>e.id===reqId)||{}).type):$('kxType').value,zone=$('kxZone').value.trim(),note=$('kxNote').value.trim(),dateEx=$('kxDate').value||todayISO();
  if(dateEx>todayISO()){err('La date de l\'examen ne peut pas être dans le futur.');return;}
  btn.disabled=true;btn.textContent='Envoi en cours…';
  try{const pf=await prepareFile(f,type+(zone?' — '+zone:'')+' — '+unesc(p.nom));const st=await storeFile(pf.bytes,pf.nom,[p.userId,d.userId]);K();
    let ex=reqId&&DB.exams.find(e=>e.id===reqId);const c=caseFor(p.id,d.id,true,type);
    if(ex){ex.zone=esc(zone||unesc(ex.zone));}else{ex={id:uid('ex'),patientId:p.id,doctorId:d.id,type:esc(type),zone:esc(zone),demandePar:'patient',creeLe:nowISO()};DB.exams.push(ex);}
    Object.assign(ex,{statut:'envoyé',dateExamen:dateEx,centre:esc($('kxCentre').value.trim()),motif:esc(note),fileId:st.id,fileNom:st.nom,fileSize:st.size,envoyeLe:nowISO(),caseId:c.id});
    ev(c,'exam_recu','Résultat envoyé : '+type+(zone?' ('+zone+')':''),ex.id);
    postMsg(p.userId,d.userId,'📎 Résultat d\'examen : '+type+(zone?' — '+zone:'')+(note?' — '+note:''),st);
    notify(d.userId,'🔬 '+p.nom+' vous a envoyé un résultat : '+type+(zone?' — '+zone:''));
    saveDB();closeModal();toast(pf.converted?'Image convertie en PDF et envoyée au médecin.':'PDF envoyé au médecin.');render();
  }catch(e){btn.disabled=false;btn.textContent='Envoyer au médecin';err(e.message||'Échec de l\'envoi.');}}

/* ---------- demande d'examen (médecin) ---------- */
function exReqModal(pid){K();const d=currentDoctor();const ps=relPatients(d);if(!ps.length){toast('Aucun patient associé pour le moment.','err');return;}
  openModal('Demander un examen',`<div class="field"><label>Patient</label><select id="krPat">${ps.map(p=>`<option value="${p.id}" ${p.id===pid?'selected':''}>${p.nom}</option>`).join('')}</select></div>
  <div class="grid g2"><div class="field"><label>Type d'examen</label><select id="krType">${EXAM_TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div><div class="field"><label>Zone / organe</label><input id="krZone" maxlength="80" placeholder="Ex. thorax de face"></div></div>
  <div class="field"><label>Instructions pour le patient</label><textarea id="krNote" rows="2" maxlength="500" placeholder="Ex. à jeun depuis 8 h, apporter l'ancienne radio…"></textarea></div>
  <label class="k-check"><input type="checkbox" id="krUrg"> Examen urgent</label><div id="krErr"></div>
  <button class="btn btn-primary btn-block" data-k="krgo">Envoyer la demande au patient</button>`);}
function doExReq(){const d=currentDoctor(),p=patientOfId($('krPat').value);if(!p){$('krErr').innerHTML='<div class="err">Choisissez un patient.</div>';return;}
  const type=$('krType').value,zone=$('krZone').value.trim(),note=$('krNote').value.trim(),urg=$('krUrg').checked;K();
  const c=caseFor(p.id,d.id,true,type);const ex={id:uid('ex'),patientId:p.id,doctorId:d.id,type:esc(type),zone:esc(zone),motif:esc(note),statut:'demandé',demandePar:'medecin',urgent:urg,creeLe:nowISO(),caseId:c.id};DB.exams.push(ex);
  ev(c,'exam_demande','Examen demandé : '+type+(zone?' ('+zone+')':'')+(urg?' — URGENT':''),ex.id);
  postMsg(d.userId,p.userId,'🔬 Je vous demande de réaliser : '+type+(zone?' ('+zone+')':'')+(urg?' — URGENT':'')+'.'+(note?' '+note:'')+' Merci de m\'envoyer le résultat en PDF via la rubrique « Examens & suivi ».');
  notify(p.userId,(urg?'🚨 ':'🔬 ')+d.nom+' vous demande un examen : '+type+(zone?' — '+zone:''));
  saveDB();closeModal();toast('Demande envoyée au patient.');render();}

/* ---------- dossier de cas : examen, avis, prescription (médecin) ---------- */
function medLine(m){m=m||{};return `<div class="kcLine"><input class="kcN" list="kMedList" maxlength="80" placeholder="Médicament" value="${esc(m.nom||'')}"><input class="kcP" maxlength="100" placeholder="Posologie (ex. 1 cp x3/jour)" value="${esc(m.posologie||'')}"><input class="kcD" maxlength="30" placeholder="Durée (ex. 5 jours)" value="${esc(m.duree||'')}"><button class="k-b" data-k="kcrm" title="Retirer">✕</button></div>`;}
function caseModal(pid,eid){K();const d=currentDoctor(),p=patientOfId(pid);if(!d||!p)return;
  const r=rec_(p.id),v=(r.vitals||[]).slice(-1)[0],ex=eid&&DB.exams.find(e=>e.id===eid&&e.doctorId===d.id),c=caseFor(p.id,d.id,false);
  const exs=DB.exams.filter(e=>e.patientId===p.id&&e.doctorId===d.id).sort((a,b)=>(b.envoyeLe||b.creeLe).localeCompare(a.envoyeLe||a.creeLe));
  const meds=[...new Set(DB.catalogue.map(m=>m.nom).concat(TPLS.flatMap(t=>t.m.map(x=>x[0]))))];
  const al=(p.allergies||[]);const rxs=r.ordonnances.filter(o=>o.doctorId===d.id).slice(-3).reverse();
  window.__kcCtx={pid:p.id,eid:ex?ex.id:''};
  openWide('📋 Dossier de cas — '+p.nom,`<datalist id="kMedList">${meds.map(m=>`<option value="${esc(m)}">`).join('')}</datalist>
  <div class="k-pinfo"><div><small>Âge</small><b>${ageOf(p.dateNaissance)||'—'}</b></div><div><small>Groupe sanguin</small><b>${p.groupeSanguin||'—'}</b></div><div><small>Dernières constantes</small><b>${v?'TA '+v.tension+' · Gly '+v.glycemie+' · '+v.poids+' kg':'—'}</b></div></div>
  ${al.length?`<div class="err">⚠️ Allergies : <b>${al.join(', ')}</b></div>`:'<div class="k-hint" style="margin-bottom:10px">Aucune allergie connue.</div>'}
  ${(p.antecedents||[]).length?`<div class="k-hint" style="margin-bottom:10px">Antécédents : ${p.antecedents.join(', ')}</div>`:''}
  ${ex?`<div class="k-exbox"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>🔬 ${ex.type}${ex.zone?' — '+ex.zone:''}</b><span class="pill ${ex.statut==='examiné'?'ok':ex.statut==='demandé'?'':'gold'}">${ex.statut}</span></div><div class="k-hint">${ex.dateExamen?'Examen du '+fdate(ex.dateExamen)+' · ':''}${ex.centre?ex.centre+' · ':''}reçu le ${ex.envoyeLe?fdate(ex.envoyeLe):'—'}</div>${ex.motif?`<div style="margin:6px 0;font-size:13.5px">« ${ex.motif} »</div>`:''}${ex.fileId?`<button class="btn btn-gold btn-sm" data-k="fview" data-id="${ex.fileId}">📄 Ouvrir le PDF du résultat</button>`:'<div class="k-hint">Résultat pas encore transmis par le patient.</div>'}</div>`:''}
  ${exs.filter(e=>!ex||e.id!==ex.id).length?`<details class="k-det"><summary>Autres examens (${exs.filter(e=>!ex||e.id!==ex.id).length})</summary>${exs.filter(e=>!ex||e.id!==ex.id).map(e=>`<div class="rowc" style="margin-top:6px"><div class="info"><div class="t1">${e.type}${e.zone?' — '+e.zone:''}</div><div class="t2">${e.statut} · ${fdate(e.envoyeLe||e.creeLe)}</div></div>${e.fileId?`<button class="btn btn-outline btn-sm" data-k="fview" data-id="${e.fileId}">PDF</button>`:''}</div>`).join('')}</details>`:''}
  ${r.consultations.length?`<details class="k-det"><summary>Historique des consultations (${r.consultations.length})</summary>${r.consultations.slice(-5).reverse().map(x=>`<div class="rowc" style="margin-top:6px"><div class="info"><div class="t1">${x.motif}</div><div class="t2">${fdate(x.date)} · ${x.diagnostic}</div></div></div>`).join('')}</details>`:''}
  ${rxs.length?`<details class="k-det"><summary>Mes dernières ordonnances</summary>${rxs.map(o=>`<div class="rowc" style="margin-top:6px"><div class="info"><div class="t1">${fdate(o.date)}</div><div class="t2">${o.medicaments.map(m=>m.nom).join(', ')}</div></div><button class="btn btn-outline btn-sm" data-k="rxpdf" data-id="${o.id}" data-pid="${p.id}">PDF</button></div>`).join('')}</details>`:''}
  <h3 style="margin:16px 0 8px">Avis du médecin</h3>
  <div class="field"><label>${ex?'Interprétation de l\'examen *':'Observations'}</label><textarea id="kcAvis" rows="3" maxlength="1500" placeholder="Ce que montre l'examen, conclusion clinique…">${ex&&ex.avis?esc(unesc(ex.avis)):''}</textarea></div>
  <div class="grid g2"><div class="field"><label>Diagnostic</label><input id="kcDiag" maxlength="150" value="${c?esc(unesc(c.diagnostic)):''}" placeholder="Ex. Pneumonie lobaire droite"></div>
  <div class="field"><label>Statut du cas</label><select id="kcStat"><option value="en cours" ${c&&c.statut==='en cours'?'selected':''}>En cours de traitement</option><option value="en suivi" ${c&&c.statut==='en suivi'?'selected':''}>En suivi</option><option value="clos">Cas clôturé</option></select></div></div>
  <h3 style="margin:14px 0 8px">Prescription (médicaments)</h3>
  <div class="field"><label>Modèle rapide</label><select id="kcTpl"><option value="">— Choisir un modèle —</option>${TPLS.map((t,i)=>`<option value="${i}">${t.n}</option>`).join('')}</select></div>
  <div id="kcMeds">${medLine()}</div><button class="btn btn-outline btn-sm" data-k="kcadd" style="margin-bottom:12px">+ Ajouter un médicament</button>
  <div class="field"><label>Conseils au patient</label><textarea id="kcConseil" rows="2" maxlength="800" placeholder="Repos, hydratation, signes d'alerte…"></textarea></div>
  <div class="field"><label>Date de contrôle (facultatif)</label><input id="kcCtl" type="date" min="${todayISO()}"></div>
  <div id="kcWarn"></div>
  <button class="btn btn-primary btn-block" data-k="kcsave">Enregistrer, prescrire et envoyer au patient</button>`);}
async function doCaseSave(){const ctx=window.__kcCtx||{},d=currentDoctor(),p=patientOfId(ctx.pid);if(!d||!p)return;K();
  const ex=ctx.eid&&DB.exams.find(e=>e.id===ctx.eid),avis=$('kcAvis').value.trim(),diag=$('kcDiag').value.trim(),stat=$('kcStat').value,conseil=$('kcConseil').value.trim(),ctl=$('kcCtl').value;
  const meds=[...document.querySelectorAll('#kcMeds .kcLine')].map(l=>({nom:l.querySelector('.kcN').value.trim(),posologie:l.querySelector('.kcP').value.trim()||'Selon prescription',duree:l.querySelector('.kcD').value.trim()})).filter(m=>m.nom);
  const warn=m=>{$('kcWarn').innerHTML=`<div class="err">${m}</div>`;toast(m.replace(/<[^>]+>/g,''),'err');};
  if(ex&&!avis){warn('Rédigez votre interprétation de l\'examen.');return;}
  if(!avis&&!diag&&!meds.length&&!conseil){warn('Renseignez au moins un avis, un diagnostic, une prescription ou un conseil.');return;}
  if(meds.length&&!diag){warn('Indiquez un diagnostic avant de prescrire.');return;}
  const hits=allergyHits(p,meds);
  if(hits.length&&!$('kcForce')){$('kcWarn').innerHTML=`<div class="err">⚠️ Risque d'allergie : <b>${hits.map(esc).join(', ')}</b> (allergies déclarées : ${(p.allergies||[]).join(', ')}).<label class="k-check" style="margin-top:8px"><input type="checkbox" id="kcForce"> Je confirme malgré le risque (prescription maintenue)</label></div>`;toast('Allergie possible : vérifiez la prescription.','err');return;}
  if(hits.length&&!$('kcForce').checked){toast('Cochez la confirmation ou retirez le médicament.','err');return;}
  const btn=document.querySelector('[data-k="kcsave"]');if(btn){btn.disabled=true;btn.textContent='Enregistrement…';}
  try{const c=caseFor(p.id,d.id,true,ex?unesc(ex.type):(diag||'Suivi médical'));
    if(diag){c.diagnostic=esc(diag);if(!c.titre||c.titre==='Suivi médical')c.titre=esc(diag);}if(avis)c.resume=esc(avis);if(ctl)c.controle=ctl;
    let rx=null;
    if(meds.length){rx={id:uid('rx'),date:todayISO(),doctorId:d.id,doctorNom:d.nom,medicaments:meds.map(m=>({nom:esc(m.nom),posologie:esc(m.posologie),duree:esc(m.duree)})),conseils:esc(conseil),controle:ctl||'',caseId:c.id,examId:ex?ex.id:''};rec_(p.id).ordonnances.push(rx);}
    rec_(p.id).consultations.push({id:uid('cons'),date:todayISO(),doctorId:d.id,doctorNom:d.nom,motif:esc(ex?'Examen : '+unesc(ex.type)+(ex.zone?' ('+unesc(ex.zone)+')':''):'Suivi du cas'),diagnostic:esc(diag||avis.slice(0,80)||'—'),traitement:esc(meds.length?meds.map(m=>m.nom+' ('+m.posologie+')').join(' ; '):(conseil||'—'))});
    if(ex){ex.statut='examiné';ex.avis=esc(avis);ex.diagnostic=esc(diag);ex.reviewedAt=nowISO();ex.caseId=c.id;if(rx)ex.rxId=rx.id;ev(c,'avis','Examen analysé par '+d.nom+' : '+avis.slice(0,160),ex.id);}
    else if(avis)ev(c,'note','Observations : '+avis.slice(0,160));
    if(diag)ev(c,'diag','Diagnostic : '+diag);
    if(rx)ev(c,'rx','Ordonnance : '+meds.map(m=>m.nom).join(', '),rx.id);
    if(ctl)ev(c,'controle','Contrôle prévu le '+fdate(ctl));
    if(stat==='clos'){c.statut='clos';ev(c,'statut','Cas clôturé par '+d.nom);}else if(c.statut!==stat){c.statut=stat;ev(c,'statut','Statut du cas : '+stat);}
    let att=null;if(rx){const pdf=rxPdf(rx,p,d);att=await storeFile(pdf,'Ordonnance_'+unesc(p.nom).replace(/\s+/g,'_')+'_'+todayISO()+'.pdf',[d.userId,p.userId]);rx.fileId=att.id;}
    const lines=['🩺 '+d.nom+' a examiné votre dossier.'];if(diag)lines.push('Diagnostic : '+diag+'.');if(avis)lines.push('Avis : '+avis.slice(0,300)+(avis.length>300?'…':''));if(meds.length)lines.push('Traitement : '+meds.map(m=>m.nom+' ('+m.posologie+(m.duree?', '+m.duree:'')+')').join(' ; ')+'.');if(conseil)lines.push('Conseils : '+conseil.slice(0,300));if(ctl)lines.push('Contrôle le '+fdate(ctl)+'.');
    postMsg(d.userId,p.userId,lines.join(' '),att);
    notify(p.userId,'🩺 '+d.nom+' a examiné votre dossier'+(rx?' et vous a prescrit un traitement':'')+'. Voir « Examens & suivi ».');
    saveDB();closeModal();toast('Dossier enregistré'+(rx?', ordonnance envoyée au patient.':'.'));render();
  }catch(e){if(btn){btn.disabled=false;btn.textContent='Enregistrer, prescrire et envoyer au patient';}warn(esc(e.message||'Échec de l\'enregistrement.'));}}

/* ---------- vues ---------- */
const EVIC={exam_demande:'🔬',exam_recu:'📎',avis:'🩺',note:'📝',diag:'🧾',rx:'💊',controle:'📅',statut:'🔖'};
const statPill=s=>`<span class="pill ${s==='examiné'||s==='clos'?'ok':s==='envoyé'||s==='en cours'?'gold':s==='demandé'?'clay':''}">${s==='envoyé'?'en attente d\'examen':s}</span>`;
function exRow(e,side){const who=side==='patient'?docNom(e.doctorId):patNom(e.patientId);
  let acts='';
  if(side==='patient'){if(e.statut==='demandé')acts=`<button class="btn btn-gold btn-sm" data-k="exsend" data-id="${e.id}">📎 Envoyer le résultat</button>`;
    else{if(e.fileId)acts+=`<button class="btn btn-outline btn-sm" data-k="fview" data-id="${e.fileId}">📄 PDF</button>`;acts+=`<button class="btn btn-outline btn-sm" data-k="chatwith" data-uid="${(docOf(e.doctorId)||{}).userId}">💬</button>`;if(e.statut==='envoyé')acts+=`<button class="btn btn-outline btn-sm" data-k="exdel" data-id="${e.id}" title="Retirer l'envoi">🗑</button>`;}}
  else{if(e.fileId)acts+=`<button class="btn btn-outline btn-sm" data-k="fview" data-id="${e.fileId}">📄 PDF</button>`;
    if(e.statut!=='demandé')acts+=`<button class="btn btn-primary btn-sm" data-k="case" data-pid="${e.patientId}" data-eid="${e.id}">${e.statut==='examiné'?'Revoir':'Examiner & prescrire'}</button>`;
    acts+=`<button class="btn btn-outline btn-sm" data-k="chatwith" data-uid="${(patientOfId(e.patientId)||{}).userId}">💬</button>`;}
  return `<div class="rowc k-ex" data-eid="${e.id}"><div class="av">🔬</div><div class="info"><div class="t1">${e.type}${e.zone?' — '+e.zone:''} ${e.urgent?'<span class="pill clay">urgent</span>':''}</div><div class="t2">${side==='patient'?'Médecin : ':'Patient : '}${who} · ${e.statut==='demandé'?'demandé le '+fdate(e.creeLe):'envoyé le '+fdate(e.envoyeLe||e.creeLe)}${e.dateExamen?' · examen du '+fdate(e.dateExamen):''}</div>${e.statut==='examiné'&&e.avis?`<div class="k-avis"><b>Avis :</b> ${e.avis}${e.diagnostic?`<br><b>Diagnostic :</b> ${e.diagnostic}`:''}</div>`:''}${e.statut==='demandé'&&e.motif?`<div class="k-hint">Instructions : ${e.motif}</div>`:''}</div>${statPill(e.statut)}<div class="actions">${acts}</div></div>`;}
function caseCard(c,side){const p=patientOfId(c.patientId),rxs=Object.keys(DB.records).length?(rec_(c.patientId).ordonnances||[]).filter(o=>o.caseId===c.id):[];
  return `<div class="card k-case"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><b>${c.titre||'Suivi médical'}</b>${statPill(c.statut)}</div>
  <div class="k-hint">${side==='patient'?'Médecin : '+docNom(c.doctorId):'Patient : '+patNom(c.patientId)} · ouvert le ${fdate(c.creeLe)}</div>
  ${c.diagnostic?`<div style="margin-top:8px"><b>Diagnostic :</b> ${c.diagnostic}</div>`:''}${c.resume?`<div class="k-hint" style="margin-top:4px">Avis : ${c.resume}</div>`:''}${c.controle?`<div style="margin-top:4px">📅 Contrôle prévu le <b>${fdate(c.controle)}</b></div>`:''}

function detect(text){const t=norm(text||'');if(!t.trim())return {sym:null,crit:false};let best=null,bs=0;
  Object.keys(SYM).forEach(k=>{const s=SYM[k].kw.reduce((n,w)=>n+(t.includes(w)?1:0),0);if(s>bs){bs=s;best=k;}});
  return {sym:best,crit:CRIT.some(r=>r.test(t))};}
function levelOf(score,S,crit,self){if(crit)return 'rouge';return score>=S.rouge?'rouge':score>=S.orange?'orange':score>=S.orange-2?'jaune':'vert';}

function patientCtx(p){const a=(p.antecedents||[]).map(norm).join(' ');return {diab:/diab/.test(a),hta:/hyperten|tension/.test(a),asthme:/asthm/.test(a),coeur:/coeur|cardi|infarct/.test(a),enceinte:/enceinte|grossesse/.test(a),allergies:(p.allergies||[]).map(unesc),age:p.dateNaissance?Math.floor((Date.now()-new Date(p.dateNaissance))/31557600000):null};}
function computeTriage(ia,p){const S=SYM[ia.sym],ctx=patientCtx(p||{});let score=S.base,crit=!!ia.crit,why=[];
  GEN.forEach((g,i)=>{if(ia.gen[i]){crit=true;why.push(g[2]);}});
  S.q.forEach((q,i)=>{if(ia.ans[i]){score+=q[1];if(q[1]>=3)why.push(q[0].replace(/ \?$/,'').replace(/^./,c=>c.toLowerCase()));}});
  if(ia.who==='bebe'){score+=3;why.push('patient : bébé');}else if(ia.who==='enfant'){score+=1;}else if(ia.who==='age'){score+=2;why.push('patient âgé');}
  if(ia.who==='me'){if(ctx.age!=null&&ctx.age>=65){score+=2;}
    if(ctx.diab&&(ia.sym==='diabete'||ia.sym==='conscience')){score+=2;why.push('antécédent de diabète');}
    if(ctx.coeur&&ia.sym==='thorax'){score+=3;why.push('antécédent cardiaque');}
    if(ctx.asthme&&ia.sym==='respiration'){score+=2;why.push('antécédent d\'asthme');}
    if(ctx.hta&&(ia.sym==='avc'||ia.sym==='thorax')){score+=1;}}
  const niveau=levelOf(score,S,crit);return {niveau,score,why:[...new Set(why)].slice(0,5),crit};}

const CLS={penicilline:['penicilline','amoxicilline','ampicilline','augmentin','oxacilline'],aspirine:['aspirine','acetylsalicylique'],ains:['ibuprofene','diclofenac','ketoprofene','aspirine'],paracetamol:['paracetamol','doliprane','efferalgan'],sulfamide:['sulfamide','cotrimoxazole','bactrim'],cephalosporine:['cefixime','ceftriaxone','cefuroxime','cefalexine'],arachide:['arachide'],lait:['lait','lactose']};
function allergyHit(e,text){const al=norm(e.allergies||'').split(/[,;\n]+/).map(s=>s.trim()).filter(s=>s.length>=3);if(!al.length)return [];const t=norm(text);const hits=[];
  al.forEach(a=>{const terms=new Set([a]);Object.keys(CLS).forEach(k=>{if(a.includes(k)||k.includes(a))CLS[k].forEach(x=>terms.add(x));});if([...terms].some(x=>t.includes(x)))hits.push(a);});return [...new Set(hits)];}

/* ---------- graphiques SVG (courbes de croissance) ---------- */
function chartSvg(e,k){const pts=mesures(e.id).map(m=>({x:ageMois(e.dateNaissance,m.date),y:k==='p'?m.poids:k==='t'?m.taille:m.pc})).filter(p=>p.y!=null);
  const W=620,H=280,ml=44,mr=14,mt=16,mb=34,mx=Math.max(24,Math.min(60,Math.ceil(Math.max(12,...pts.map(p=>p.x),ageMois(e.dateNaissance))/12)*12));
  const xs=AG.filter(a=>a<=mx);if(xs[xs.length-1]<mx)xs.push(mx);const ref=a=>refAt(e.sexe,k,Math.min(a,60));
  const lo=xs.map(a=>ref(a)*BAND[k][0]),hi=xs.map(a=>ref(a)*BAND[k][1]);let ymin=Math.min(...lo,...pts.map(p=>p.y)),ymax=Math.max(...hi,...pts.map(p=>p.y));const pad=(ymax-ymin)*.08;ymin=Math.floor(ymin-pad);ymax=Math.ceil(ymax+pad);
  const X=a=>ml+(a/mx)*(W-ml-mr),Y=v=>H-mb-((v-ymin)/(ymax-ymin))*(H-mt-mb);
  const line=arr=>xs.map((a,i)=>(i?'L':'M')+X(a).toFixed(1)+' '+Y(arr[i]).toFixed(1)).join(' ');
  const band=xs.map((a,i)=>(i?'L':'M')+X(a).toFixed(1)+' '+Y(hi[i]).toFixed(1)).join(' ')+' '+xs.slice().reverse().map((a,i)=>'L'+X(a).toFixed(1)+' '+Y(lo[xs.length-1-i]).toFixed(1)).join(' ')+' Z';
  let grid='';for(let i=0;i<=4;i++){const v=ymin+(ymax-ymin)*i/4;grid+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${ml-6}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--ink-600)">${v.toFixed(k==='p'?1:0)}</text>`;}
  const xt=xs.filter((a,i)=>mx<=24?true:[0,6,12,24,36,48,60].includes(a)).map(a=>`<text x="${X(a).toFixed(1)}" y="${H-12}" text-anchor="middle" font-size="11" fill="var(--ink-600)">${a<24?a+' m':(a/12)+' a'}</text>`).join('');
  const sorted=pts.slice().sort((a,b)=>a.x-b.x);const path=sorted.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" class="pd-chart" role="img" aria-label="Courbe ${MLAB[k][0]}">${grid}<path d="${band}" fill="rgba(31,138,138,.12)"/><path d="${line(xs.map(ref))}" fill="none" stroke="var(--teal-500)" stroke-width="1.6" stroke-dasharray="5 4"/>${sorted.length?`<path d="${path}" fill="none" stroke="var(--clay-600)" stroke-width="2.6"/>`:''}${sorted.map(p=>`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="4.5" fill="var(--clay-600)" stroke="#fff" stroke-width="1.5"><title>${p.y} ${MLAB[k][1]} à ${p.x.toFixed(1)} mois</title></circle>`).join('')}${xt}</svg>
  <div class="k-hint">— — médiane OMS · zone verte : −2 / +2 DS · ligne rouge : ${esc0(e.prenom)}</div>`;}

/* ---------- évaluation des symptômes (app.js + config.php) ---------- */
function evalSymp(list,temp,ageM){let niveau='surveillance',reco='Surveiller à domicile, consulter si aggravation.';const grave=[];const has=s=>list.includes(s);
  if(temp!=null&&temp>=38&&ageM!=null&&ageM<3){grave.push('Fièvre chez un nourrisson de moins de 3 mois : toujours urgent');}
  if(has('convulsions')||has('difficultes_respiratoires')||has('levres_bleues')||(temp!=null&&temp>=39.5)||grave.length){niveau='urgence';reco='Consulter immédiatement aux urgences ou appeler le 1515 (SAMU).';}
  else if((temp!=null&&temp>38.5)||has('vomissements')||has('diarrhee')||has('refus_teter')||has('pleurs_inhabituels')||has('absence_urine')||has('toux')&&has('fievre')){niveau='consultation';reco='Consulter un médecin dans les 24 heures.';}
  if(temp!=null&&temp>39&&niveau!=='urgence'){niveau='consultation';}
  if(has('refus_teter'))grave.push('Refus de s\'alimenter');if(has('pleurs_inhabituels'))grave.push('Pleurs inhabituels');if(has('absence_urine'))grave.push('Signe possible de déshydratation');if(has('diarrhee')&&has('vomissements'))grave.push('Diarrhée + vomissements : risque de déshydratation, donner des SRO');
  return {niveau,reco,grave:[...new Set(grave)]};}
const NIV={urgence:{c:'#c1440e',bg:'#fbe6db',ic:'🚨',t:'URGENCE'},consultation:{c:'#c8930c',bg:'#faf1dc',ic:'⚠️',t:'CONSULTATION'},surveillance:{c:'#2f7d4f',bg:'#e5f3ea',ic:'✅',t:'SURVEILLANCE'}};
function sympResult(r,list){const N=NIV[r.niveau];const shown=['fièvre','diarrhée','toux'].filter(k=>list.includes({fièvre:'fievre',diarrhée:'diarrhee',toux:'toux'}[k]));
  return `<div class="pd-res" style="background:${N.bg};border-color:${N.c}"><div style="font-size:30px">${N.ic}</div><div><div class="pd-lv" style="color:${N.c}">${N.t}</div><div><b>${r.reco}</b></div>${r.grave.length?`<ul class="ia-ul">${r.grave.map(g=>`<li>${g}</li>`).join('')}</ul>`:''}</div></div>
  ${r.niveau==='urgence'?'<div class="xrow"><a class="btn btn-clay" style="text-decoration:none" href="tel:1515">📞 Appeler le SAMU 1515</a></div>':''}
  ${shown.map(k=>`<div class="k-note" style="margin-top:8px"><b>${k[0].toUpperCase()+k.slice(1)} — repères</b><br>🟢 Surveillance : ${SIGNES[k].s}<br>🟠 Consultation : ${SIGNES[k].c}<br>🔴 Urgence : ${SIGNES[k].u}</div>`).join('')}
  <div class="k-hint" style="margin-top:8px">Cette évaluation ne remplace pas un avis médical.</div>`;}
function doseCalc(poids,key){const M=MEDS[key];if(!poids||poids<=0)return {err:'Indiquez le poids de l\'enfant.'};if(poids<2||poids>60)return {err:'Poids hors limites (2 à 60 kg).'};if(poids<M.minKg)return {err:key+' non recommandé en dessous de '+M.minKg+' kg.'};
  const dose=Math.round(poids*M.mgkg*10)/10,ml=Math.round(dose/M.conc*10)/10,maxj=dose*M.max;return {dose,ml,maxj,M};}
function doseHtml(poids,key){const r=doseCalc(poids,key);if(r.err)return `<div class="err">${r.err}</div>`;return `<div class="pd-dose"><b>${key}</b> — ${r.dose} mg par prise (${r.M.mgkg} mg/kg) soit <b>${r.ml} ml</b> de ${r.M.concTxt}<br>Intervalle : ${r.M.inter} · maximum ${r.M.max} prises/24 h (${r.maxj} mg/jour)<br><span class="k-hint">${r.M.note}</span></div>`;}

function slotsFor(did,date){const taken=DB.rdvPed.filter(r=>r.medecinId===did&&r.date===date&&r.statut==='planifié').map(r=>r.heure),now=new Date(),isT=date===todayISO(),cur=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),out=[];
  for(let h=8;h<18;h++)['00','30'].forEach(m=>{const s=String(h).padStart(2,'0')+':'+m;if(!taken.includes(s)&&!(isT&&s<=cur))out.push(s);});return out;}

function kidSave(id){const g=i=>$(i).value.trim(),err=m=>{$('pkErr').innerHTML=`<div class="err">${m}</div>`;};const p=currentPatient();if(!p)return;
  const prenom=g('pkPrenom'),naiss=g('pkNaiss'),sexe=g('pkSexe');if(!prenom){err('Le prénom est obligatoire.');return;}if(!naiss){err('La date de naissance est obligatoire.');return;}if(naiss>todayISO()){err('La date de naissance ne peut pas être dans le futur.');return;}if(ageMois(naiss)>216){err('Ce module concerne les enfants de moins de 18 ans.');return;}if(!sexe){err('Sélectionnez le sexe.');return;}
  const gest=num(g('pkGest')),pn=num(g('pkPoids')),tn=num(g('pkTaille'));if(gest!=null&&(gest<20||gest>45)){err('Âge gestationnel : 20 à 45 semaines.');return;}if(pn!=null&&(pn<.5||pn>6)){err('Poids de naissance : 0,5 à 6 kg.');return;}if(tn!=null&&(tn<30||tn>60)){err('Taille de naissance : 30 à 60 cm.');return;}
  const data={prenom:esc(prenom),nom:esc(g('pkNom')),dateNaissance:naiss,sexe,ageGest:gest==null?'':gest,groupe:$('pkGroupe').value,poidsNaiss:pn==null?'':pn,tailleNaiss:tn==null?'':tn,antecedents:esc(g('pkAnt')),allergies:esc(g('pkAll'))};
  if(id){const k=kid(id);if(!k||k.parentId!==p.id)return;const dobChanged=k.dateNaissance!==naiss;Object.assign(k,data);if(dobChanged){const done=DB.vaccinsPed.filter(v=>v.enfantId===id&&v.statut==='fait');DB.vaccinsPed=DB.vaccinsPed.filter(v=>v.enfantId!==id||v.statut==='fait');const np=planVaccins(k);done.forEach(d=>{const m=np.find(x=>x.vaccin===d.vaccin&&x.dose===d.dose);if(m){Object.assign(m,{statut:'fait',dateFaite:d.dateFaite,lot:d.lot,par:d.par});}});DB.vaccinsPed=DB.vaccinsPed.filter(v=>v.enfantId!==id||!done.includes(v));
      DB.vaccinsPed=DB.vaccinsPed.filter((v,i,a)=>a.findIndex(x=>x.id===v.id)===i);}
    saveDB();closeModal();toast('Profil mis à jour.');render();return;}
  const k=Object.assign({id:uid('en'),parentId:p.id,createdAt:nowISO()},data);DB.enfants.push(k);const vs=planVaccins(k);
  if($('pkVac')&&$('pkVac').checked)vs.forEach(v=>{if(v.datePrevue<=todayISO()){v.statut='fait';v.dateFaite=v.datePrevue;v.par='parent';}});
  if(pn!=null&&tn!=null)DB.croissance.push({id:uid('cr'),enfantId:k.id,date:naiss,poids:pn,taille:tn,pc:null,ageMois:0,imc:Math.round(pn/Math.pow(tn/100,2)*10)/10,par:'parent'});
  PD.eid=k.id;PD.prof=null;saveDB();closeModal();toast('Enfant ajouté. Le calendrier vaccinal a été planifié.');render();}
function measModal(eid){const k=kid(eid);if(!k)return;openModal('Ajouter une mesure — '+k.prenom,`<div class="field"><label>Date de la mesure *</label><input id="pmDate" type="date" min="${k.dateNaissance}" max="${todayISO()}" value="${todayISO()}"></div><div class="grid g2"><div class="field"><label>Poids (kg) *</label><input id="pmPoids" type="number" step="0.01" min="0.5" max="120"></div><div class="field"><label>Taille (cm) *</label><input id="pmTaille" type="number" step="0.1" min="30" max="210"></div></div><div class="field"><label>Périmètre crânien (cm)</label><input id="pmPC" type="number" step="0.1" min="25" max="65"></div><div id="pmErr"></div><button class="btn btn-primary btn-block" data-k="pd_msave" data-id="${eid}">Enregistrer la mesure</button>`);}

  const refBlock=`<div id="pyRefWrap" class="pm-reveal" hidden><div class="field"><label>Référence de transaction</label><input id="payRef" maxlength="40" placeholder="Ex : TX123456" autocomplete="off"><div class="k-hint" id="pyRefHint">Saisissez la référence reçue par SMS (4 à 40 caractères).</div></div><button class="btn btn-primary btn-block" id="paySend" disabled>Envoyer ma preuve de paiement</button></div>`;

    btn.onclick=()=>{const v=inp.value.trim();if(!refOk(v)||DB.payments.some(p=>p.ref===v&&p.statut!=='rejeté')){toast('Référence invalide ou déjà utilisée.','err');return;}done(mkRec(k,amount,label,opts,'à vérifier',v));};}
  function reveal(k){const w=$('pyRefWrap');if(!w||!w.hidden)return;w.hidden=false;const b=$('pySent');if(b)b.style.display='none';wireRef(k);setTimeout(()=>{const i=$('payRef');if(i)i.focus();},60);}
  function panel(){const k=S.m,m=METH.find(x=>x.k===k),fee=feeOf(amount,k),total=amount+fee;

      $('pyOpen').onclick=()=>setTimeout(()=>reveal(k),400);$('pySent').onclick=()=>reveal(k);warn();return;}

  document.querySelectorAll('#pyGrid .pm-tile').forEach(t=>{t.onclick=()=>select(t.dataset.pm,true);t.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(t.dataset.pm,true);}};});

function mkRec(m,amount,label,opts,statut,ref){const M=METH.find(x=>x.k===m),fee=feeOf(amount,m);return {id:uid('pay'),kref:kref(),userId:SESSION.userId,userNom:currentUser().nom,montant:amount,frais:fee,methode:M.n,mk:m,ref,label:esc(label),date:todayISO(),heure:new Date().toTimeString().slice(0,5),statut,kind:opts.kind||'achat',mode:CFG().mode};}
function finalize(rec,onSuccess,opts){DB.payments.push(rec);
  if(rec.mk==='wallet'&&!wDebit(rec.userId,rec.montant,rec.label,rec.id)){DB.payments.pop();toast('Solde insuffisant.','err');return false;}
  if(rec.kind==='recharge'&&rec.statut==='confirmé')wCredit(rec.userId,rec.montant,'recharge','Recharge '+rec.methode,rec.id);
  if(rec.statut==='à vérifier')DB.users.filter(x=>x.role==='admin').forEach(a=>notify(a.id,'💰 Paiement à vérifier : '+fmoney(rec.montant)+' ('+rec.methode+') de '+rec.userNom));
  else notify(rec.userId,'✅ Paiement confirmé : '+fmoney(rec.montant)+' — '+unesc(rec.label));
  saveDB();closeModal();
  try{onSuccess&&onSuccess(rec.methode,rec.ref);}catch(e){console.error(e);}
  if(rec.statut==='confirmé'){setPayStatus(rec.ref,'confirmé');}
  saveDB();if(rec.statut==='confirmé')toast('Paiement confirmé ✔ — reçu disponible dans « Paiements ».');else toast('Preuve de paiement envoyée : en attente de validation.');
  if(opts&&opts.kind==='recharge')render();return true;}

/* ---------- revenus (médecins / prestataires) ---------- */
function earnings(u){let items=[],pct=+DB.settings.commissionStandard||0;
  if(u.role==='medecin'){const d=DB.doctors.find(x=>x.userId===u.id);if(!d)return null;if(d.premium)pct=+DB.settings.commissionPremium||0;
    DB.appointments.filter(a=>a.doctorId===d.id&&a.statut==='terminé'&&a.paiement&&a.paiement.statut==='confirmé').forEach(a=>items.push({date:a.date,label:'Consultation — '+unesc(a.patientNom),m:+d.tarif||0}));
    (DB.rdvPed||[]).filter(r=>r.medecinId===d.id&&r.statut==='terminé'&&r.paiement&&r.paiement.statut==='confirmé').forEach(r=>items.push({date:r.date,label:'Consultation pédiatrique',m:+d.tarif||0}));}
  else if(u.role==='prestataire'){const pr=DB.providers.find(x=>x.userId===u.id);if(!pr)return null;DB.serviceOrders.filter(o=>o.providerId===pr.id&&o.statut==='terminée'&&o.paiement&&o.paiement.statut==='confirmé').forEach(o=>items.push({date:o.date,label:o.categorie+' — '+unesc(o.patientNom),m:+o.montant||0}));}
  else return null;
  const gross=items.reduce((s,i)=>s+i.m,0),com=Math.round(gross*pct/100),net=gross-com,rt=DB.retraits.filter(r=>r.userId===u.id&&r.statut!=='refusé'),out=rt.reduce((s,r)=>s+r.montant,0);
  return {items,gross,com,pct,net,out,avail:Math.max(0,net-out)};}

window.srvOpenConv=async function(id,nom){
  CONV=id;LAST=0;PENDING=[];
  const isP=SESSION&&SESSION.role==='patient',dc=isP?await KAYAPI.req('GET','/api/documents'):{ok:false};
  q('smBox').innerHTML='<p><button class="btn" onclick="srvConvs()">← Conversations</button></p><h3>'+E(nom)+'</h3><div id="smMsgs" style="max-height:360px;overflow:auto;border:1px solid #dcd6c6;border-radius:10px;padding:10px;margin:0 0 10px"></div><form id="smF" onsubmit="event.preventDefault();srvSend()"><label for="smTxt">Votre message</label><textarea id="smTxt" rows="3" maxlength="2000" style="width:100%"></textarea>'+(dc.ok&&dc.documents.length?'<label>Joindre un document de mon dossier<br><select id="smDoc"><option value="">Aucun</option>'+dc.documents.map(d=>'<option value="'+d.id+'">'+E(d.filename)+'</option>').join('')+'</select></label>':'')+'<p><button class="btn btn-primary" type="submit">Envoyer</button> <span id="smSt" role="status"></span></p></form>';
  await poll();TIMER=setInterval(()=>{if(VIEW!=='messages'||CONV!==id){clearInterval(TIMER);return;}poll();},8000);
};
function draw(list,append){
  const el=q('smMsgs');if(!el)return;if(!append)el.innerHTML='';
  list.forEach(m=>{const d=document.createElement('div');d.style.cssText='margin:6px 0;text-align:'+(m.moi?'right':'left');
    d.innerHTML='<span style="display:inline-block;max-width:80%;padding:8px 12px;border-radius:12px;background:'+(m.moi?'#d9ece8':'#f3ecdc')+'">'+E(m.body).replace(/\n/g,'<br>')+(m.piece_jointe?'<br><i>📎 '+E(m.piece_jointe)+'</i>':'')+'</span><br><small style="opacity:.7">'+E(T(m.created_at))+(m.moi?(m.lu?' · lu':' · envoyé'):'')+'</small>';el.appendChild(d);});
  el.scrollTop=el.scrollHeight;
}
async function poll(){
  const id=CONV;if(!id)return;const r=await KAYAPI.req('GET','/api/conversations/'+id+'/messages?after='+LAST);
  if(!r.ok||id!==CONV)return;
  if(r.messages.length){draw(r.messages,LAST>0);LAST=r.messages[r.messages.length-1].id;}
  // mise à jour des accusés de lecture des messages déjà affichés : rechargement complet si l'un des miens vient d'être lu
  if(LAST>0&&r.messages.length===0&&PENDING.length===0){const f=await KAYAPI.req('GET','/api/conversations/'+id+'/messages?after=0');if(f.ok&&id===CONV)draw(f.messages,false);}
  const f=q('smF');if(f&&r.peut_ecrire===false){f.innerHTML='<p><i>La prise en charge est terminée : vous pouvez relire cette conversation mais plus écrire.</i></p>';}
}
window.srvSend=async function(){
  const t=q('smTxt'),doc=q('smDoc'),body=t.value.trim();if(!body&&!(doc&&doc.value))return;
  const m={clientId:uuid(),body,documentId:doc&&doc.value||undefined};await send(m,t);
};
async function send(m,t){
  const st=q('smSt');if(st)st.textContent='Envoi…';
  const r=await KAYAPI.post('/api/conversations/'+CONV+'/messages',m);
  if(r.ok){if(t){t.value='';const d=q('smDoc');if(d)d.value='';}PENDING=PENDING.filter(x=>x.clientId!==m.clientId);if(st)st.textContent='';await poll();return;}
  if(r.network){PENDING.push(m);if(st)st.innerHTML='<span role="alert">Message non envoyé (réseau). <button type="button" class="btn" id="smRetry">Réessayer</button></span>';const b=q('smRetry');if(b)b.onclick=()=>send(m,t); // même clientId : aucun doublon
  }else{if(st)st.innerHTML='<span role="alert">'+E(r.error)+'</span>';}
}
const rp3=renderPatientView;renderPatientView=function(){return VIEW==='messages'?msgView():rp3();};
const rd3=renderDoctorView;renderDoctorView=function(){return VIEW==='messages'?msgView():rd3();};
})();

(function(){
const E=s=>String(s==null?'':s).replace(/[<>"']/g,c=>({'<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DD=iso=>String(iso).slice(0,10).split('-').reverse().join('/');
const q=id=>document.getElementById(id),later=fn=>setTimeout(fn,0);
const row='style="border:1px solid #dcd6c6;border-radius:10px;padding:12px;margin:0 0 10px"';
const ok=(r,m)=>{if(!r.ok){toast(r.error||'Erreur','error');return false;}if(m)toast(m);return true;};
const age=m=>m<24?m+' mois':Math.floor(m/12)+' ans'+(m%12?' '+(m%12)+' mois':'');
const WHO={patient:'saisi par le parent',medecin:'saisi par un médecin'};
function chart(g,key,label,unit){
  const pts=g.filter(x=>!x.voided_at&&x[key]!=null).map(x=>({d:new Date(x.measured_on).getTime(),v:Number(x[key])})).sort((a,b)=>a.d-b.d);
  if(pts.length<2)return '';
  const W=320,H=120,P=24,dx=Math.max(1,pts[pts.length-1].d-pts[0].d),vs=pts.map(p=>p.v),lo=Math.min(...vs),hi=Math.max(...vs),dv=Math.max(1e-6,hi-lo);
  const xy=p=>[P+(p.d-pts[0].d)/dx*(W-2*P),H-P-(p.v-lo)/dv*(H-2*P)];
  return '<figure style="margin:8px 0"><svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:360px" role="img" aria-label="Évolution : '+E(label)+'"><polyline fill="none" stroke="#0a6b63" stroke-width="2" points="'+pts.map(p=>xy(p).join(',')).join(' ')+'"/>'+pts.map(p=>{const c=xy(p);return '<circle cx="'+c[0]+'" cy="'+c[1]+'" r="3" fill="#c9a227"/>';}).join('')+'<text x="4" y="12" font-size="10" fill="currentColor">'+E(label)+' ('+unit+') : '+lo+' → '+hi+'</text></svg><figcaption style="font-size:12px;opacity:.8">Courbe des mesures de cet enfant uniquement. Aucune courbe de référence : demandez l\'interprétation à un professionnel de santé.</figcaption></figure>';
}
const growthRows=(g,canVoid,uid)=>g.length?g.map(x=>'<div '+row+(x.voided_at?' ':'')+'>'+(x.voided_at?'<s>':'')+DD(x.measured_on)+' · '+[x.poids_kg!=null?x.poids_kg+' kg':'',x.taille_cm!=null?x.taille_cm+' cm':'',x.pc_cm!=null?'PC '+x.pc_cm+' cm':''].filter(Boolean).join(' · ')+(x.voided_at?'</s> <i>annulée</i>':'')+' <small style="opacity:.8">('+(WHO[x.recorded_role]||'')+')</small>'+(!x.voided_at&&canVoid?' <button class="btn" onclick="srvPedVoid(\'growth\',\''+x.id+'\')">Annuler</button>':'')+'</div>').join(''):'<p>Aucune mesure.</p>';
const vaccRows=(v,canVoid)=>v.length?v.map(x=>'<div '+row+'>'+(x.voided_at?'<s>':'')+'<b>'+E(x.vaccine)+'</b>'+(x.dose?' · '+E(x.dose):'')+' · '+DD(x.given_on)+(x.lot?' · lot '+E(x.lot):'')+(x.administered_by?' · '+E(x.administered_by):'')+(x.next_due?' · prochaine dose prévue le '+DD(x.next_due):'')+(x.voided_at?'</s> <i>annulée</i>':'')+' <small style="opacity:.8">('+(WHO[x.recorded_role]||'')+')</small>'+(!x.voided_at&&canVoid?' <button class="btn" onclick="srvPedVoid(\'vaccines\',\''+x.id+'\')">Annuler</button>':'')+'</div>').join(''):'<p>Aucune vaccination enregistrée.</p>';
const formsHtml=()=>'<h4>Ajouter une mesure</h4><form id="pgF" onsubmit="event.preventDefault();srvPedGrowth()" style="display:flex;gap:8px;flex-wrap:wrap"><label>Date<br><input type="date" name="d" required></label><label>Poids (kg)<br><input name="p" inputmode="decimal" size="6"></label><label>Taille (cm)<br><input name="t" inputmode="decimal" size="6"></label><label>Périmètre crânien (cm)<br><input name="c" inputmode="decimal" size="6"></label><button class="btn btn-primary" type="submit" style="align-self:end">Ajouter</button></form>'+
  '<h4>Ajouter une vaccination</h4><form id="pvF" onsubmit="event.preventDefault();srvPedVacc()" style="display:flex;gap:8px;flex-wrap:wrap"><label>Vaccin<br><input name="v" required maxlength="80"></label><label>Dose<br><input name="dose" maxlength="40" size="8"></label><label>Date<br><input type="date" name="d" required></label><label>N° de lot<br><input name="lot" maxlength="40" size="8"></label><label>Lieu / vaccinateur<br><input name="by" maxlength="120"></label><label>Prochaine dose prévue<br><input type="date" name="nd"></label><button class="btn btn-primary" type="submit" style="align-self:end">Ajouter</button></form><p style="opacity:.8">Le calendrier vaccinal n\'est pas pré-rempli : reportez les dates indiquées par votre carnet ou votre médecin (programme national de vaccination).</p>';
let CUR=null,ROLE=null;
const num=v=>String(v||'').trim().replace(',','.')||undefined;
window.srvPedGrowth=async function(){const f=q('pgF').elements;if(ok(await KAYAPI.post('/api/dependents/'+CUR.id+'/growth',{measured_on:f.d.value,poids_kg:num(f.p.value),taille_cm:num(f.t.value),pc_cm:num(f.c.value)}),'Mesure ajoutée.'))reload();};
window.srvPedVacc=async function(){const f=q('pvF').elements;if(ok(await KAYAPI.post('/api/dependents/'+CUR.id+'/vaccines',{vaccine:f.v.value,dose:f.dose.value,given_on:f.d.value,lot:f.lot.value,administered_by:f.by.value,next_due:f.nd.value||undefined}),'Vaccination ajoutée.'))reload();};
window.srvPedVoid=async function(kind,id){const r=prompt('Motif de l\'annulation (l\'entrée reste visible, barrée) :');if(!r)return;if(ok(await KAYAPI.post('/api/dependents/'+CUR.id+'/'+kind+'/'+id+'/void',{reason:r}),'Entrée annulée.'))reload();};
const reload=()=>ROLE==='patient'?srvOpenKid(CUR.id):srvOpenChild(CUR.id,CUR.nom,true);

/* ===== Soins à domicile : interface branchée sur l'API serveur ===== */
(function(){
const E=s=>String(s==null?'':s).replace(/[<>"']/g,c=>({'<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const F=n=>Number(n||0).toLocaleString('fr-FR')+' FCFA';
const DT=iso=>String(iso).slice(0,10).split('-').reverse().join('/');
const q=id=>document.getElementById(id),later=fn=>setTimeout(fn,0);
const row='style="border:1px solid #dcd6c6;border-radius:10px;padding:12px;margin:0 0 10px"';
const ok=(r,m)=>{if(!r.ok){toast(r.error||'Erreur','error');return false;}if(m)toast(m);return true;};
const box=(id,t,i)=>'<div class="card" style="margin:16px"><h2 style="margin:0 0 8px">'+t+'</h2>'+(i?'<p style="margin:0 0 12px;opacity:.85">'+i+'</p>':'')+'<div id="'+id+'" aria-live="polite">Chargement…</div></div>';
const MS={pending_payment:['À payer','gold'],confirmee:['Confirmée','ok'],declaree_realisee:['Terminée (à confirmer)','gold'],terminee:['Terminée','ok'],annulee:['Annulée','clay'],litige:['Litige en cours','clay'],ouverte:['Ouverte','gold'],attribuee:['Attribuée','ok'],proposee:['En attente','gold'],acceptee:['Acceptée','ok'],refusee:['Non retenu','clay']};
const pill=s=>{const x=MS[s]||[s,''];return '<span class="pill '+x[1]+'">'+x[0]+'</span>';};
const stars=(n,k)=>n?'★ '+n+' ('+k+' avis)':'Pas encore d\'avis';
let CATS=[];
const catName=id=>(CATS.find(c=>c.id===id)||{nom:id}).nom;
async function cats(){if(!CATS.length){const r=await KAYAPI.req('GET','/api/care/categories');if(r.ok)CATS=r.categories;}return CATS;}

/* ---------- Patient ---------- */
function srvView(){later(srvCare);return box('scBox','Services à domicile','Les prestataires de santé réglementés sont vérifiés par un administrateur (diplôme et numéro d\'inscription). Les services « non médicaux » ne sont pas des soins. <b>En cas d\'urgence : 1515.</b> Ne décrivez pas de détails médicaux sensibles dans votre demande ; votre adresse n\'est communiquée qu\'au prestataire que vous retenez.');}
window.srvCare=async function(){
  await cats();const [d,ms,dp]=await Promise.all([KAYAPI.req('GET','/api/care/requests'),KAYAPI.req('GET','/api/care/missions'),KAYAPI.req('GET','/api/dependents')]);

  q('scBox').innerHTML='<h3>Nouvelle demande</h3><form id="scF" onsubmit="event.preventDefault();srvNewReq()" style="display:flex;gap:8px;flex-wrap:wrap"><label>Type de service<br><select name="cat">'+CATS.map(c=>'<option value="'+c.id+'">'+E(c.nom)+'</option>').join('')+'</select></label><label>Ville ou quartier<br><input name="zone" required maxlength="60"></label><label>Date souhaitée<br><input type="date" name="d"></label>'+(dp.ok&&dp.dependents.length?'<label>Pour<br><select name="dep"><option value="">Moi-même</option>'+dp.dependents.map(x=>'<option value="'+E(x.id)+'">'+E(x.nom)+'</option>').join('')+'</select></label>':'')+'<label style="flex-basis:100%">Besoin (court, sans détail médical sensible)<br><input name="desc" maxlength="300" style="width:100%"></label><button class="btn btn-primary" type="submit">Demander des devis</button></form>'+

    (r.status==='ouverte'?(r.devis.length?r.devis.map(v=>'<div style="margin:8px 0 0 12px">'+E(v.prestataire)+' · '+stars(v.note,v.nb_avis)+' · <b>'+F(v.prix_fcfa+v.frais_fcfa)+'</b> (dont déplacement '+F(v.frais_fcfa)+')'+(v.message?' · « '+E(v.message)+' »':'')+' <button class="btn btn-primary" onclick="srvAccept(\''+r.id+'\',\''+v.id+'\')">Choisir</button></div>').join(''):'<p style="margin:8px 0 0 12px;opacity:.8">En attente de devis.</p>'):'')+'</div>').join(''):'<p>Aucune demande.</p>')+

  if(!me)return false;
  if(!patient){const pr=await KAYAPI.req('GET','/api/doctor/profile');if(pr.ok&&pr.profile){const v=!!pr.profile.verified_at;DB.doctors.filter(d=>d.userId===u.id).forEach(d=>{d.verifie=v;d.enAttenteValidation=!v;});}}
  const stubDoc=(sid,nom,spec)=>{let d=DB.doctors.find(x=>x.sid===sid);if(!d){d={id:'srvd_'+sid,sid,stub:true,userId:null,nom,specialite:spec||'',tarif:0,langues:['Français'],note:'0.0',nbAvis:0,ville:'',verifie:true,enAttenteValidation:false,numeroOrdre:'—',hopital:'',tel:'',bio:'',agenda:[],revenus:0};DB.doctors.push(d);}return d;};
  const stubPat=(nom)=>{const id='srvp_'+nom;let p=DB.patients.find(x=>x.id===id);if(!p){p={id,stub:true,userId:null,nom,dateNaissance:'',groupeSanguin:'',allergies:[],antecedents:[],membres:[],assurance:null,gps:null,ville:'',carteId:'',codeParrainage:'',filleuls:[],gains:0,favoris:[]};DB.patients.push(p);rec_(id);}return p;};
  const list=(r.appointments||[]).map(x=>{
    const t=new Date(x.starts_at),date=t.getFullYear()+'-'+two(t.getMonth()+1)+'-'+two(t.getDate()),heure=two(t.getHours())+':'+two(t.getMinutes());
    const d=patient?stubDoc(x.doctor_id,x.medecin,x.specialite):me,pt=patient?me:stubPat(x.patient);
    return {id:'srva_'+x.id,sid:x.id,patientId:pt.id,patientNom:x.enfant||pt.nom,doctorId:d.id,doctorNom:d.nom,date,heure,type:x.mode==='cabinet'?'domicile':x.mode,statut:ST[x.status]||'en attente',motif:x.motif||'',paiement:{methode:x.payment_mode==='sur_place'?'Sur place':'Wave',txId:'',statut:x.status==='pending_payment'?'à vérifier':'payé'},montant:x.amount_fcfa};
  });
  const sig=JSON.stringify(list);if(sig===_syncSig)return false;_syncSig=sig;
  // les rendez-vous « locaux » de cet utilisateur étaient des données de démonstration : le serveur fait foi
  DB.appointments=DB.appointments.filter(a=>patient?a.patientId!==me.id:a.doctorId!==me.id).concat(list);
  saveDB();return true;
}
const _nav0=navigate;
navigate=function(v,s){_nav0(v,s);syncAppts().then(ch=>{if(ch&&VIEW===v&&!document.getElementById('modalOverlay'))render();});};

loadSession();
if(SESSION && (!DB.users.find(u=>u.id===SESSION.userId) || Date.now()-(SESSION.t||0)>12*3600*1000)){ SESSION=null; localStorage.removeItem(SESSION_KEY); }
if(SESSION&&!SESSION.srv){ SESSION=null; localStorage.removeItem(SESSION_KEY); }
if(SESSION){ VIEW = /paiement=retour/.test(location.search)?'rdv':'dashboard'; }
render();
if(SESSION)syncAppts(true).then(c=>{if(c)render();});
if(SESSION)KAYAPI.me().then(r=>{if(r.status===401){SESSION=null;localStorage.removeItem(SESSION_KEY);VIEW='login';render();toast('Session expirée. Reconnectez-vous.');}else if(!r.ok&&r.network)toast('Serveur injoignable : certaines actions peuvent échouer.');});
</script>
